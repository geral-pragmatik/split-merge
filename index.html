        function processCollisions() {
          if (particles.length < 2) return;

          const thresholdSq = COLLISION_DISTANCE * COLLISION_DISTANCE;

          // Final two: their collision is the rebirth event.
          if (mode === "final" && particles.length === 2) {
            const a = particles[0];
            const b = particles[1];

            if (a.cooldown <= 0 && b.cooldown <= 0) {
              tempV1.copy(b.pos).sub(a.pos);
              const distSq = tempV1.lengthSq();

              if (distSq > 0 && distSq <= thresholdSq) {
                tempNormal.copy(tempV1).normalize();
                tempV2.copy(b.vel).sub(a.vel);

                if (tempV2.dot(tempNormal) < 0) {
                  triggerRebirthCollision(a, b);
                }
              }
            }

            return;
          }

          const removed = new Set();
          const additions = [];
          let projectedCount = particles.length;

          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];

            if (removed.has(a.id) || a.cooldown > 0) continue;

            for (let j = i + 1; j < particles.length; j++) {
              const b = particles[j];

              if (removed.has(b.id) || b.cooldown > 0) continue;

              tempV1.copy(b.pos).sub(a.pos);
              const distSq = tempV1.lengthSq();

              if (distSq > thresholdSq || distSq === 0) continue;

              tempNormal.copy(tempV1).normalize();

              tempV2.copy(b.vel).sub(a.vel);
              const closing = tempV2.dot(tempNormal);

              if (closing >= 0) continue;

              removed.add(a.id);
              removed.add(b.id);

              if (mode === "split") {
                const currentAfterRemoval = projectedCount - 2;
                const room = maxBalls - currentAfterRemoval;
                const spawnCount = Math.max(2, Math.min(4, room));
                const collisionPoint = a.pos.clone().add(b.pos).multiplyScalar(0.5);

                playCollisionSound("split", collisionPoint);
                spawnSplitSparks(collisionPoint);

                additions.push(...splitPair(a, b, spawnCount));
                projectedCount = currentAfterRemoval + spawnCount;
              } else if (mode === "merge") {
                const collisionPoint = a.pos.clone().add(b.pos).multiplyScalar(0.5);

                playCollisionSound("merge", collisionPoint);
                spawnMergeHighlight(collisionPoint);

                additions.push(mergePair(a, b));
                projectedCount -= 1;
              }

              break;
            }
          }

          if (removed.size === 0) return;

          particles = particles.filter((p) => !removed.has(p.id));
          particles.push(...additions);

          if (mode === "split" && particles.length >= maxBalls) {
            particles = particles.slice(0, maxBalls);
            startCelebration("max");
            return;
          }

          if (mode === "merge" && particles.length <= MIN_BALLS) {
            particles = particles.slice(0, MIN_BALLS);

            // Only the collision behavior changes here. The sphere keeps
            // following the SAME shrink curve with no radius/timer handoff.
            // The final two remain free (no artificial inward force), while
            // the continuously shrinking boundary raises collision probability.
            mode = "final";

            return;
          }
        }

        function recordTrail(particle) {
          particle.history.unshift(particle.pos.clone());
          particle.historyColors.unshift(
            particleColorFromHeat(particle.heat, new THREE.Color())
          );

          if (particle.history.length > trailLength) {
            particle.history.length = trailLength;
            particle.historyColors.length = trailLength;
          }
        }

        function updateTrails() {
          let vertexIndex = 0;

          for (const particle of particles) {
            const history = particle.history;
            const historyColors = particle.historyColors;
            const segmentCount = Math.min(history.length - 1, trailLength - 1);

            for (let i = 0; i < segmentCount; i++) {
              if (vertexIndex + 2 >= MAX_TRAIL_VERTICES) break;

              const p1 = history[i];
              const p2 = history[i + 1];

              const fade1 = 1 - i / Math.max(1, trailLength);
              const fade2 = 1 - (i + 1) / Math.max(1, trailLength);

              const c1 = historyColors[i] || populationColor(tempColor);
              const c2 = historyColors[i + 1] || c1;

              const base1 = vertexIndex * 3;
              trailPositions[base1] = p1.x;
              trailPositions[base1 + 1] = p1.y;
              trailPositions[base1 + 2] = p1.z;

              trailColors[base1] = c1.r * fade1;
              trailColors[base1 + 1] = c1.g * fade1;
              trailColors[base1 + 2] = c1.b * fade1;

              vertexIndex++;

              const base2 = vertexIndex * 3;
              trailPositions[base2] = p2.x;
              trailPositions[base2 + 1] = p2.y;
              trailPositions[base2 + 2] = p2.z;

              trailColors[base2] = c2.r * fade2 * 0.74;
              trailColors[base2 + 1] = c2.g * fade2 * 0.74;
              trailColors[base2 + 2] = c2.b * fade2 * 0.74;

              vertexIndex++;
            }
          }

          trailGeometry.setDrawRange(0, vertexIndex);
          trailGeometry.attributes.position.needsUpdate = true;
          trailGeometry.attributes.color.needsUpdate = true;
        }

        function updateSparks(dt) {
          if (sparks.length === 0) {
            sparkGeometry.setDrawRange(0, 0);
            return;
          }

          let count = 0;

          for (const s of sparks) {
            s.life += dt;
            if (s.life >= s.maxLife) continue;

            s.pos.addScaledVector(s.vel, dt);
            s.vel.multiplyScalar(Math.pow(0.965, dt * 60));

            const lifeFade = 1 - s.life / s.maxLife;
            const base = count * 3;

            sparkPositions[base] = s.pos.x;
            sparkPositions[base + 1] = s.pos.y;
            sparkPositions[base + 2] = s.pos.z;

            sparkColors[base] = s.color.r * lifeFade;
            sparkColors[base + 1] = s.color.g * lifeFade;
            sparkColors[base + 2] = s.color.b * lifeFade;

            count++;
            if (count >= MAX_SPARKS) break;
          }

          sparkGeometry.setDrawRange(0, count);
          sparkGeometry.attributes.position.needsUpdate = true;
          sparkGeometry.attributes.color.needsUpdate = true;

          sparks = sparks.filter((s) => s.life < s.maxLife);

          if (celebration && sparks.length < 70) {
            spawnCelebrationSparks(celebration);
          }
        }

        function updatePhysics(dt, now) {
          updatePointerWorld();

          if (!started || paused) {
            return;
          }

          updateLocalCollisionEffects(dt);
          updateSparks(dt);

          if (celebration) {
            const duration =
              celebration === "max"
                ? MAX_EXPANSION_MS
                : REBIRTH_EXPLOSION_MS;

            if (now - celebrationStarted >= duration) {
              finishCelebration();
            }

            return;
          }

          trailTick++;

          for (const p of particles) {
            if (p.cooldown > 0) p.cooldown--;

            // Smooth, per-particle color evolution.
            p.heat = dampScalar(
              p.heat,
              p.targetHeat ?? p.heat,
              PARTICLE_COLOR_SMOOTHING,
              dt
            );

            // If the sphere contracted around a particle since the last frame,
            // immediately project it back inside before applying motion.
            clampInside(p.pos, VISUAL_RADIUS);

            applyPhaseForce(p, dt);
            applyGravity(p, dt);

            p.pos.addScaledVector(p.vel, dt);
            bounceInsideSphere(p);

            if ((trailTick & 1) === 0) {
              recordTrail(p);
            }
          }

          processCollisions();
        }

        function celebrationProgress(now) {
          if (!celebration) return 0;

          const duration =
            celebration === "max"
              ? MAX_EXPANSION_MS
              : REBIRTH_EXPLOSION_MS;

          return THREE.MathUtils.clamp(
            (now - celebrationStarted) / duration,
            0,
            1
          );
        }

        function updateArenaRadius(now) {
          if (paused) return;

          if (celebration === "max") {
            const t = celebrationProgress(now);
            const eased = THREE.MathUtils.smoothstep(t, 0, 1);
            currentArenaRadius = THREE.MathUtils.lerp(
              ARENA_RADIUS,
              MAX_ARENA_RADIUS,
              eased
            );
            return;
          }

          if (celebration === "rebirth") {
            const t = celebrationProgress(now);

            // Explosive ease-out: most of the diameter returns immediately,
            // with a smaller settling tail.
            const explosive = 1 - Math.pow(1 - t, 4.2);

            currentArenaRadius = THREE.MathUtils.lerp(
              rebirthStartRadius,
              MAX_ARENA_RADIUS,
              explosive
            );
            return;
          }

          if (mode === "merge" || mode === "final") {
            if (!mergeShrinkStarted) {
              mergeShrinkStarted = now;
              mergeShrinkStartRadius = currentArenaRadius || MAX_ARENA_RADIUS;
            }

            // One continuous timeline from the first merge frame until
            // the last two particles collide. Entering "final" changes
            // collision/force behavior only; the radius never pauses,
            // resets, or changes compression speed.
            const elapsed = Math.max(0, (now - mergeShrinkStarted) / 1000);

            currentArenaRadius = Math.max(
              FINAL_MIN_RADIUS,
              mergeShrinkStartRadius - MERGE_SHRINK_RATE * elapsed
            );

            return;
          }

          if (mode === "split" && postExplosionStarted > 0) {
            const t = THREE.MathUtils.clamp(
              (now - postExplosionStarted) / POST_EXPLOSION_SETTLE_MS,
              0,
              1
            );

            const eased = THREE.MathUtils.smoothstep(t, 0, 1);

            currentArenaRadius = THREE.MathUtils.lerp(
              MAX_ARENA_RADIUS,
              ARENA_RADIUS,
              eased
            );

            if (t >= 1) {
              postExplosionStarted = 0;
              currentArenaRadius = ARENA_RADIUS;
            }

            return;
          }

          currentArenaRadius = ARENA_RADIUS;
        }

        function impactEnvelope(t) {
          // Fast attack, smooth decay.
          const attack = THREE.MathUtils.smoothstep(t, 0.0, 0.16);
          const decay = 1.0 - THREE.MathUtils.smoothstep(t, 0.20, 1.0);
          return THREE.MathUtils.clamp(attack * decay, 0, 1);
        }

        function updateInstances(now) {
          const t = celebrationProgress(now);
          const impact = impactEnvelope(t);
          const arenaScale = currentArenaRadius / ARENA_RADIUS;

          const pulse =
            celebration
              ? 1 + 0.10 * impact
              : 1;

          boundary.scale.setScalar(arenaScale);
          shell.scale.setScalar(arenaScale);
          ring.scale.setScalar(arenaScale);

          particleMesh.count = particles.length;
          glowMesh.count = particles.length;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            dummy.position.copy(p.pos);
            dummy.rotation.set(0, 0, 0);

            // Perspective cue: particles physically closer to the camera feel slightly larger.
            tempV3.copy(camera.position).sub(p.pos);
            const cameraDistance = tempV3.length();
            const depthScale = THREE.MathUtils.clamp(10.0 / cameraDistance, 0.82, 1.22);
            const particleColor = particleColorFromHeat(p.heat, tempColor);

            dummy.scale.setScalar(pulse * depthScale);
            dummy.updateMatrix();

            particleMesh.setMatrixAt(i, dummy.matrix);
            particleMesh.setColorAt(i, particleColor);

            dummy.scale.setScalar(
              depthScale * (
                celebration === "max"
                  ? 1.25 + 0.35 * Math.sin(now * 0.018 + i)
                  : celebration === "rebirth"
                    ? 1.55 + 0.52 * Math.sin(now * 0.020 + i)
                    : 1
              )
            );
            dummy.updateMatrix();

            glowMesh.setMatrixAt(i, dummy.matrix);

            if (celebration === "max") {
              tempColor2.set(0xffd27a);
            } else if (celebration === "rebirth") {
              tempColor2.set(0xb9f6ff);
            } else {
              tempColor2.copy(particleColor);
            }

            glowMesh.setColorAt(i, tempColor2);
          }

          particleMesh.instanceMatrix.needsUpdate = true;
          glowMesh.instanceMatrix.needsUpdate = true;

          if (particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate = true;
          if (glowMesh.instanceColor) glowMesh.instanceColor.needsUpdate = true;

          updateTrails();

          boundary.material.opacity =
            celebration
              ? 0.075 + 0.08 * impact
              : 0.075;

          shell.material.opacity =
            celebration
              ? 0.022 + 0.065 * impact
              : 0.022;

          // One clean radial shockwave rather than a long sparkle pause.
          if (celebration) {
            const waveScale =
              arenaScale *
              (
                celebration === "rebirth"
                  ? 0.90 + t * 0.42
                  : 0.985 + t * 0.17
              );

            shockwaveSphere.visible = true;
            shockwaveSphere.scale.setScalar(waveScale);
            shockwaveSphere.material.opacity =
              Math.max(0, (1 - t) * 0.24);

            shockwaveSphere.material.color.set(
              celebration === "max" ? 0xffbc72 : 0xb6f7ff
            );
          } else {
            shockwaveSphere.visible = false;
            shockwaveSphere.material.opacity = 0;
            shockwaveSphere.scale.setScalar(1);
          }

          trailLines.visible = celebration !== "rebirth";
        }

        function updateCinematicEffects(now) {
          const p = populationProgress();
          const t = celebrationProgress(now);
          const impact = impactEnvelope(t);

          // Keep the center of the sphere in focus while breathing very slightly.
          bokehPass.uniforms.focus.value =
            8.55 + 0.12 * Math.sin(now * 0.00035);

          if (celebration) {
            const baseBloom = window.innerWidth < 900 ? 0.70 : 0.88;

            bloomPass.strength =
              baseBloom +
              (
                celebration === "max"
                  ? 0.72
                  : 1.05
              ) * impact;

            cinematicPass.uniforms.vignetteAmount.value =
              0.30 - 0.10 * impact;

            camera.fov =
              celebration === "max"
                ? 48 + 1.15 * impact
                : 48 + 2.45 * impact;
          } else {
            bloomPass.strength =
              (window.innerWidth < 900 ? 0.52 : 0.70) +
              p * 0.10;

            cinematicPass.uniforms.vignetteAmount.value = 0.34;
            camera.fov = 48;
          }

          camera.updateProjectionMatrix();
          cinematicPass.uniforms.time.value = now;
        }

        function updateDynamicLighting() {
          const p = averageParticleHeat();

          const cold = new THREE.Color(0x78dfff);
          const warm = new THREE.Color(0xff7040);

          keyLight.color.copy(cold).lerp(new THREE.Color(0xffffff), 0.65);
          rimLight.color.copy(cold).lerp(warm, p * 0.22);
          warmLight.color.copy(new THREE.Color(0xff7a3d));
          warmLight.intensity = 14 + p * 10;

          coreMaterial.emissive.copy(populationColor(tempColor2)).multiplyScalar(0.12 + p * 0.10);
          coreMaterial.emissiveIntensity = 0.5;

          // Keep the shell mostly neutral so the particle colors carry the narrative.
          boundary.material.color.copy(cold).lerp(new THREE.Color(0xffffff), 0.08 + p * 0.06);
          shell.material.color.copy(cold).lerp(warm, p * 0.16);
        }

        function stopCameraSpin() {
          cameraSpin.active = false;
          if (spinButton) {
            spinButton.classList.remove("spinning");
            spinButton.setAttribute("aria-label", "Spin the Singularity");
            spinButton.title = "Spin";
          }
        }

        function startCameraSpin() {
          if (!started) return;

          // Pick a random 2D orbit vector. Keep some azimuth component so
          // the motion never reads as a mostly vertical tilt.
          let azimuth = Math.random() * 2 - 1;
          let polar = Math.random() * 1.4 - 0.7;

          if (Math.abs(azimuth) < 0.35) {
            azimuth = (azimuth < 0 ? -1 : 1) * 0.35;
          }

          const magnitude = Math.hypot(azimuth, polar) || 1;

          cameraSpin.azimuthComponent = azimuth / magnitude;
          cameraSpin.polarComponent = polar / magnitude;
          cameraSpin.duration = 2800 + Math.random() * 1400;
          cameraSpin.speed = 0.78 + Math.random() * 0.22;
          cameraSpin.startedAt = performance.now();
          cameraSpin.active = true;

          if (spinButton) {
            spinButton.classList.add("spinning");
            spinButton.setAttribute("aria-label", "Spin in progress");
            spinButton.title = "Spinning…";
          }
        }

        function updateCamera(now, dt) {
          // No passive camera motion. OrbitControls owns all manual movement.
          controls.autoRotate = false;
          controls.target.set(0, 0, 0);
          controls.update();

          if (!cameraSpin.active) return;

          // Manual interaction always overrides the synthetic spin.
          if (orbiting || pointer.pressed || gesture.down) {
            stopCameraSpin();
            return;
          }

          const elapsed = now - cameraSpin.startedAt;
          const progress = THREE.MathUtils.clamp(
            elapsed / cameraSpin.duration,
            0,
            1
          );

          if (progress >= 1) {
            stopCameraSpin();
            return;
          }

          // Smoothly accelerate and decelerate, like a deliberate finger drag.
          const envelope = Math.sin(progress * Math.PI);
          const phaseFactor =
            celebration === "rebirth"
              ? 0.65
              : celebration === "max"
                ? 0.82
                : 1;

          const step = cameraSpin.speed * envelope * phaseFactor * dt;

          cameraSpinOffset.copy(camera.position).sub(controls.target);
          cameraSpinSpherical.setFromVector3(cameraSpinOffset);

          cameraSpinSpherical.theta +=
            step * cameraSpin.azimuthComponent;
          cameraSpinSpherical.phi +=
            step * cameraSpin.polarComponent;

          const minPhi = controls.minPolarAngle + CAMERA_SPIN_POLAR_MARGIN;
          const maxPhi = controls.maxPolarAngle - CAMERA_SPIN_POLAR_MARGIN;

          if (cameraSpinSpherical.phi <= minPhi) {
            cameraSpinSpherical.phi = minPhi;
            cameraSpin.polarComponent = Math.abs(cameraSpin.polarComponent);
          } else if (cameraSpinSpherical.phi >= maxPhi) {
            cameraSpinSpherical.phi = maxPhi;
            cameraSpin.polarComponent = -Math.abs(cameraSpin.polarComponent);
          }

          cameraSpinSpherical.makeSafe();
          cameraSpinOffset.setFromSpherical(cameraSpinSpherical);
          camera.position.copy(controls.target).add(cameraSpinOffset);
          camera.lookAt(controls.target);
        }

        function animate(now) {
          const rawDt = (now - lastFrame) / 1000;
          lastFrame = now;
          const dt = Math.min(rawDt, 0.035);

          updateCamera(now, dt);

          if (!paused) {
            updateArenaRadius(now);
            updateDynamicLighting();
            updateCinematicEffects(now);
            updatePhysics(dt, now);
          } else {
            updateDynamicLighting();
          }

          updateInstances(now);
          composer.render(dt);
          requestAnimationFrame(animate);
        }

        function setPointerFromEvent(event) {
          const rect = renderer.domElement.getBoundingClientRect();

          pointer.ndc.x =
            ((event.clientX - rect.left) / rect.width) * 2 - 1;

          pointer.ndc.y =
            -((event.clientY - rect.top) / rect.height) * 2 + 1;

          pointer.pointerType = event.pointerType || "mouse";
          pointer.active = true;
        }


        function togglePause() {
          if (!started) return;

          if (!paused) {
            paused = true;
            pausedAt = performance.now();

            // Freeze active motion states immediately.
            stopCameraSpin();
            gesture.down = false;
            gesture.moved = false;
            pointer.pressed = false;
            orbiting = false;
          } else {
            const resumeAt = performance.now();
            const pauseDelta = pausedAt ? resumeAt - pausedAt : 0;
            paused = false;
            pausedAt = 0;

            // Shift time-based timelines forward so nothing jumps on resume.
            if (celebrationStarted) celebrationStarted += pauseDelta;
            if (mergeShrinkStarted) mergeShrinkStarted += pauseDelta;
            if (postExplosionStarted) postExplosionStarted += pauseDelta;
            if (cameraSpin.active) cameraSpin.startedAt += pauseDelta;

            lastFrame = resumeAt;
          }
        }

        function updateSoundButton() {
          if (!soundButton) return;

          soundButton.classList.toggle("muted", !soundEnabled);
          soundButton.setAttribute(
            "aria-label",
            soundEnabled ? "Turn sound off" : "Turn sound on"
          );
          soundButton.title = soundEnabled ? "Sound off" : "Sound on";
        }

        async function toggleSound() {
          soundEnabled = !soundEnabled;
          updateSoundButton();

          if (!audioContext && soundEnabled) {
            await unlockAudio();
          }

          if (!audioOutput || !audioContext) return;

          const t = audioContext.currentTime;
          audioOutput.gain.cancelScheduledValues(t);
          audioOutput.gain.setValueAtTime(audioOutput.gain.value, t);
          audioOutput.gain.linearRampToValueAtTime(
            soundEnabled ? 1 : 0,
            t + 0.09
          );
        }

        function restartExperience() {
          if (!started) return;

          currentArenaRadius = ARENA_RADIUS;
          postExplosionStarted = 0;
          mergeShrinkStarted = 0;
          mergeShrinkStartRadius = MAX_ARENA_RADIUS;
          finalShrinkStarted = 0;
          rebirthStartRadius = MIN_ARENA_RADIUS;

          celebration = null;
          sparks = [];
          sparkGeometry.setDrawRange(0, 0);
          clearLocalCollisionEffects();

          trailLines.visible = true;
          shockwaveSphere.visible = false;
          shockwaveSphere.material.opacity = 0;
          shockwaveSphere.scale.setScalar(1);

          world.scale.setScalar(1);

          camera.fov = 48;
          camera.updateProjectionMatrix();

          controls.enabled = true;
          controls.autoRotate = false;
          controls.autoRotateSpeed = 0;
          stopCameraSpin();

          resetAt(new THREE.Vector3());

          if (
            soundEnabled &&
            audioContext &&
            audioContext.state === "running"
          ) {
            playIgnitionSound();
          }
        }

        function startExperience() {
          if (started || starting) return;
          starting = true;

          // Remove the invitation immediately on the trusted user gesture.
          if (startPrompt) {
            startPrompt.classList.add("hidden");
            window.setTimeout(() => startPrompt.remove(), 180);
          }

          try {
            // MOBILE-SAFE STARTUP:
            // Never block the visual experience on Web Audio. Some mobile
            // browsers can keep AudioContext.resume() pending/suspended even
            // after a valid tap. Start the world immediately and let audio
            // unlock independently.
            const audioUnlockPromise = unlockAudio();

            currentArenaRadius = ARENA_RADIUS;
            postExplosionStarted = 0;
            mergeShrinkStarted = 0;
            mergeShrinkStartRadius = MAX_ARENA_RADIUS;
            finalShrinkStarted = 0;
            rebirthStartRadius = MIN_ARENA_RADIUS;

            resetAt(new THREE.Vector3());

            controls.enabled = true;
            controls.autoRotate = false;

            // Show the 3D world immediately; audio must never gate rendering.
            requestAnimationFrame(() => {
              renderer.domElement.style.opacity = "1";
              if (controlsPanel) controlsPanel.classList.add("visible");
            });

            if (!animationLoopStarted) {
              animationLoopStarted = true;
              lastFrame = performance.now();
              requestAnimationFrame(animate);
            }

            // Best-effort ignition sound. If the browser delays/denies audio,
            // the visual experience still runs normally.
            Promise.resolve(audioUnlockPromise)
              .then((audioReady) => {
                if (audioReady && started && soundEnabled) {
                  playIgnitionSound();
                }
              })
              .catch((error) => {
                console.warn("Singularity audio unlock deferred:", error);
              });
          } catch (error) {
            console.error("Singularity startup failed:", error);
          } finally {
            starting = false;
          }
        }

        for (const button of [spinButton, soundButton, restartButton]) {
          if (!button) continue;

          button.addEventListener("pointerdown", (event) => {
            event.stopPropagation();
          });

          button.addEventListener("pointerup", (event) => {
            event.stopPropagation();
          });
        }

        if (spinButton) {
          spinButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            startCameraSpin();
          });
        }

        if (soundButton) {
          soundButton.addEventListener("click", async (event) => {
            event.preventDefault();
            event.stopPropagation();
            await toggleSound();
          });
        }

        if (restartButton) {
          restartButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            restartExperience();
          });
        }

        updateSoundButton();

        renderer.domElement.addEventListener("pointerdown", (event) => {
          event.preventDefault();

          if (!started) {
            // pointerdown is used deliberately: it is a trusted user gesture,
            // so this same action can unlock Web Audio.
            startExperience();
            return;
          }

          setPointerFromEvent(event);
          stopCameraSpin();

          pointer.pressed = true;
          orbiting = false;

          gesture.down = true;
          gesture.startedAt = performance.now();
          gesture.startX = event.clientX;
          gesture.startY = event.clientY;
          gesture.lastX = event.clientX;
          gesture.lastY = event.clientY;
          gesture.lastAzimuth = controls.getAzimuthalAngle();
          gesture.lastPolar = controls.getPolarAngle();
          gesture.moved = false;

          try {
            renderer.domElement.setPointerCapture(event.pointerId);
          } catch (_) {}
        }, { passive: false });

        renderer.domElement.addEventListener("pointermove", (event) => {
          if (!started || !gesture.down) return;

          setPointerFromEvent(event);

          if (gesture.down) {
            const moved = Math.hypot(
              event.clientX - gesture.startX,
              event.clientY - gesture.startY
            );

            gesture.lastAzimuth = controls.getAzimuthalAngle();
            gesture.lastPolar = controls.getPolarAngle();
            gesture.lastX = event.clientX;
            gesture.lastY = event.clientY;

            if (moved >= MOVE_THRESHOLD_PX) {
              gesture.moved = true;
              orbiting = true;
              pointer.pressed = false;
            }
          }
        }, { passive: false });

        renderer.domElement.addEventListener("pointerup", (event) => {
          event.preventDefault();

          if (
            started &&
            soundEnabled &&
            (!audioContext || audioContext.state !== "running")
          ) {
            void unlockAudio();
          }

          if (!gesture.down) return;

          const isTap =
            !gesture.moved &&
            performance.now() - gesture.startedAt < HOLD_THRESHOLD_MS;

          gesture.down = false;
          pointer.pressed = false;
          orbiting = false;

          if (pointer.pointerType !== "mouse") {
            pointer.active = false;
          }

          try {
            renderer.domElement.releasePointerCapture(event.pointerId);
          } catch (_) {}

          gesture.moved = false;

          if (isTap) {
            togglePause();
          }
        }, { passive: false });

        renderer.domElement.addEventListener("pointercancel", () => {
          gesture.down = false;
          gesture.moved = false;
          pointer.pressed = false;
          orbiting = false;

          if (pointer.pointerType !== "mouse") {
            pointer.active = false;
          }
        });

        renderer.domElement.addEventListener("pointerleave", () => {
          if (!gesture.down) {
            pointer.active = false;
            pointer.pressed = false;
            orbiting = false;
          }
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();

          const pr = renderPixelRatio();

          renderer.setPixelRatio(pr);
          renderer.setSize(window.innerWidth, window.innerHeight);

          composer.setPixelRatio(pr);
          composer.setSize(window.innerWidth, window.innerHeight);

          bloomPass.setSize(window.innerWidth, window.innerHeight);
          bloomPass.strength = window.innerWidth < 900 ? 0.58 : 0.78;

          bokehPass.uniforms.aperture.value =
            window.innerWidth < 900 ? 0.00028 : 0.00042;

          bokehPass.uniforms.maxblur.value =
            window.innerWidth < 900 ? 0.0038 : 0.0058;

          cinematicPass.uniforms.grainAmount.value =
            window.innerWidth < 900 ? 0.016 : 0.012;

          controls.update();
        });

        // Initial state: completely black and inert.
        // The first click/tap invokes startExperience().
        started = false;
        paused = false;
        particles = [];
        particleMesh.count = 0;
        glowMesh.count = 0;
        trailGeometry.setDrawRange(0, 0);
        sparkGeometry.setDrawRange(0, 0);

        renderer.setClearColor(0x000000, 1);
        renderer.clear();
      } catch (error) {
        console.error(error);
        errorText.textContent =
          "The 3D engine could not load or WebGL initialization failed. " +
          (error && error.message ? error.message : "");
        errorBox.classList.add("show");
      }
    })();
  </script>
</body>
</html>
