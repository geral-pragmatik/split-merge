<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta
    name="description"
    content="Singularity — an immersive generative world of expansion, complexity, collapse and rebirth."
  />
  <meta property="og:title" content="Singularity — A Little Singularity" />
  <meta
    property="og:description"
    content="Two particles collide and ignite a living 3D world that expands into complexity, collapses back to two, and is reborn."
  />
  <meta property="og:image" content="og-preview.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Singularity</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage:active {
      cursor: grabbing;
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #startPrompt {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    #startPrompt span {
      color: rgba(230, 247, 255, 0.88);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      text-align: center;
      text-shadow:
        0 0 10px rgba(126, 218, 255, 0.24),
        0 0 26px rgba(126, 218, 255, 0.10);
      animation: invitationPulse 2.4s ease-in-out infinite;
      will-change: opacity, transform, text-shadow;
    }

    @keyframes invitationPulse {
      0%, 100% {
        opacity: 0.46;
        transform: scale(0.985);
        text-shadow:
          0 0 8px rgba(126, 218, 255, 0.16),
          0 0 20px rgba(126, 218, 255, 0.06);
      }

      50% {
        opacity: 1;
        transform: scale(1.015);
        text-shadow:
          0 0 14px rgba(126, 218, 255, 0.34),
          0 0 34px rgba(126, 218, 255, 0.16);
      }
    }

    #startPrompt.hidden {
      opacity: 0;
    }

    #startPrompt.hidden span {
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #startPrompt span {
        animation: none;
        opacity: 0.88;
        transform: none;
      }
    }

    #controls {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      z-index: 12;
      display: flex;
      gap: 10px;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition:
        opacity 220ms ease,
        transform 220ms ease;
    }

    #controls.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .controlButton {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      padding: 0;
      background: rgba(8, 10, 14, 0.34);
      color: rgba(255, 255, 255, 0.78);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition:
        color 160ms ease,
        border-color 160ms ease,
        background 160ms ease,
        transform 120ms ease;
    }

    .controlButton:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
      background: rgba(16, 20, 28, 0.54);
    }

    .controlButton:active {
      transform: scale(0.94);
    }

    .controlButton:focus-visible {
      outline: 2px solid rgba(143, 233, 255, 0.72);
      outline-offset: 3px;
    }

    .controlButton svg {
      width: 19px;
      height: 19px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Explicit specificity prevents the generic .controlButton svg rule
       from making both sound icons visible at the same time. */
    @keyframes spinControlIcon {
      to { transform: rotate(360deg); }
    }

    #spinButton.spinning {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(20, 28, 40, 0.62);
    }

    #spinButton.spinning svg {
      animation: spinControlIcon 820ms linear infinite;
    }

    #soundButton .soundOnIcon {
      display: block;
    }

    #soundButton .soundOffIcon {
      display: none;
    }

    #soundButton.muted .soundOnIcon {
      display: none;
    }

    #soundButton.muted .soundOffIcon {
      display: block;
    }

    @media (max-width: 700px) {
      #controls {
        top: max(14px, env(safe-area-inset-top));
        right: max(14px, env(safe-area-inset-right));
        gap: 8px;
      }

      .controlButton {
        width: 40px;
        height: 40px;
      }
    }

    .error {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .error.show { display: grid; }

    .error div {
      max-width: 560px;
      line-height: 1.5;
    }
  
    #stage canvas {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
</style>
</head>

<body>
  <div id="stage" aria-label="Interactive 3D Singularity particle experience"></div>
  <div id="startPrompt" aria-hidden="true"><span>Tap to Enter</span></div>

  <div id="controls" aria-label="Experience controls">
    <button
      id="spinButton"
      class="controlButton"
      type="button"
      aria-label="Spin the Singularity"
      title="Spin"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.8 8.5A8 8 0 0 1 18 5.4"></path>
        <path d="M18 2.8v3.8h-3.8"></path>
        <path d="M19.2 15.5A8 8 0 0 1 6 18.6"></path>
        <path d="M6 21.2v-3.8h3.8"></path>
      </svg>
    </button>

    <button
      id="soundButton"
      class="controlButton"
      type="button"
      aria-label="Turn sound off"
      title="Sound on/off"
    >
      <svg class="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6.7 8.5H3.5v7h3.2L11 19z"></path>
        <path d="M15 9.2a4 4 0 0 1 0 5.6"></path>
        <path d="M17.8 6.5a7.7 7.7 0 0 1 0 11"></path>
      </svg>
      <svg class="soundOffIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6.7 8.5H3.5v7h3.2L11 19z"></path>
        <path d="m15.5 9 5 6"></path>
        <path d="m20.5 9-5 6"></path>
      </svg>
    </button>

    <button
      id="restartButton"
      class="controlButton"
      type="button"
      aria-label="Restart Singularity"
      title="Restart"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
        <path d="M20 5v6h-6"></path>
      </svg>
    </button>
  </div>

  <div id="error" class="error">
    <div>
      <h2>Singularity could not start</h2>
      <p id="errorText">Your browser may not support the required WebGL features.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    (async () => {
      const errorBox = document.getElementById("error");
      const errorText = document.getElementById("errorText");

      try {

        const stage = document.getElementById("stage");
        const startPrompt = document.getElementById("startPrompt");
        const controlsPanel = document.getElementById("controls");
        const spinButton = document.getElementById("spinButton");
        const soundButton = document.getElementById("soundButton");
        const restartButton = document.getElementById("restartButton");

        const ARENA_RADIUS = 3.0;
        const VISUAL_RADIUS = 0.075;
        const COLLISION_DISTANCE = 0.26;
        const BASE_SPEED = 1.28;
        const MIN_BALLS = 2;
        const MAX_ALLOWED = 512;
        const MAX_EXPANSION_MS = 850;
        const REBIRTH_EXPLOSION_MS = 900;
        const POST_EXPLOSION_SETTLE_MS = 1200;
        const HOLD_THRESHOLD_MS = 220;
        const MOVE_THRESHOLD_PX = 8;

        let maxBalls = 256;
        let gravityStrength = 0.36;
        let trailLength = 18;

        const MAX_ARENA_RADIUS = ARENA_RADIUS * 1.075;
        const MIN_ARENA_RADIUS = ARENA_RADIUS * 0.25;

        let currentArenaRadius = ARENA_RADIUS;
        let postExplosionStarted = 0;
        let mergeShrinkStarted = 0;
        let mergeShrinkStartRadius = MAX_ARENA_RADIUS;
        let finalShrinkStarted = 0;
        let rebirthStartRadius = MIN_ARENA_RADIUS;

        // Merge and the final-two state now share one uninterrupted
        // compression curve. There is no radius handoff or second shrink.
        // This safety floor is just large enough for the final visible pair
        // to remain physically valid until their natural collision.
        const FINAL_MIN_RADIUS =
          VISUAL_RADIUS + COLLISION_DISTANCE * 0.5 + 0.005;
        const MERGE_SHRINK_RATE = 0.54; // continuous world units per second

        let particles = [];
        let nextId = 1;
        let mode = "split";
        let celebration = null;
        let celebrationStarted = 0;
        let started = false;
        let starting = false;
        let paused = false;
        let pausedAt = 0;
        let lastFrame = performance.now();
        let trailTick = 0;

        const gesture = {
          down: false,
          startedAt: 0,
          startX: 0,
          startY: 0,
          lastX: 0,
          lastY: 0,
          lastAzimuth: 0,
          lastPolar: Math.PI * 0.5,
          moved: false
        };

        const pointer = {
          active: false,
          pressed: false,
          pointerType: "mouse",
          ndc: new THREE.Vector2(0, 0),
          world: new THREE.Vector3(0, 0, 0)
        };

        let orbiting = false;

        // Camera motion is user-triggered only. The Spin control performs
        // a short synthetic orbit in a freshly randomized direction.
        const cameraSpin = {
          active: false,
          startedAt: 0,
          duration: 3200,
          azimuthComponent: 1,
          polarComponent: 0,
          speed: 0.86
        };
        const CAMERA_SPIN_POLAR_MARGIN = 0.06;
        const cameraSpinSpherical = new THREE.Spherical();
        const cameraSpinOffset = new THREE.Vector3();

        let audioContext = null;
        let audioMaster = null;
        let audioCompressor = null;
        let audioOutput = null;
        let animationLoopStarted = false;
        let soundEnabled = true;

        const MASTER_GAIN = 0.72;

        const soundState = {
          splitLastAt: 0,
          mergeLastAt: 0,
          activeVoices: 0,
          maxVoices: 18
        };

        async function unlockAudio() {
          try {
            if (!audioContext) {
              const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

              if (!AudioContextClass) {
                console.warn("Singularity audio: Web Audio API unavailable");
                return false;
              }

              audioContext = new AudioContextClass();

              audioMaster = audioContext.createGain();
              audioMaster.gain.value = MASTER_GAIN;

              audioCompressor = audioContext.createDynamicsCompressor();
              audioCompressor.threshold.value = -18;
              audioCompressor.knee.value = 16;
              audioCompressor.ratio.value = 7;
              audioCompressor.attack.value = 0.003;
              audioCompressor.release.value = 0.18;

              audioOutput = audioContext.createGain();
              audioOutput.gain.value = soundEnabled ? 1 : 0;

              audioMaster.connect(audioCompressor);
              audioCompressor.connect(audioOutput);
              audioOutput.connect(audioContext.destination);
            }

            if (audioContext.state !== "running") {
              await audioContext.resume();
            }

            console.info("Singularity audio:", audioContext.state);
            return audioContext.state === "running";
          } catch (error) {
            console.error("Singularity audio failed to start:", error);
            return false;
          }
        }

        function playIgnitionSound() {
          if (!audioContext || audioContext.state !== "running" || !audioMaster) {
            return;
          }

          const t = audioContext.currentTime;

          // Deliberately easy-to-hear test tone: short, bright, and distinct.
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

          osc.connect(gain);
          gain.connect(audioMaster);

          osc.start(t);
          osc.stop(t + 0.24);
        }

        function createStereoOutput(worldPosition, gainValue) {
          if (!audioContext || !audioMaster) return null;

          const gain = audioContext.createGain();
          gain.gain.value = gainValue;

          if (audioContext.createStereoPanner && worldPosition) {
            const projected = worldPosition.clone().project(camera);
            const pan = audioContext.createStereoPanner();
            pan.pan.value = THREE.MathUtils.clamp(projected.x, -0.85, 0.85);
            gain.connect(pan);
            pan.connect(audioMaster);
          } else {
            gain.connect(audioMaster);
          }

          return { gain };
        }

        function registerVoice(durationSeconds) {
          soundState.activeVoices++;

          window.setTimeout(() => {
            soundState.activeVoices = Math.max(0, soundState.activeVoices - 1);
          }, Math.ceil(durationSeconds * 1000) + 80);
        }

        function playSplitSound(worldPosition) {
          if (
            !audioContext ||
            audioContext.state !== "running" ||
            soundState.activeVoices >= soundState.maxVoices
          ) return;

          const nowMs = performance.now();
          const minInterval =
            particles.length > 180 ? 48 :
            particles.length > 90 ? 34 :
            20;

          if (nowMs - soundState.splitLastAt < minInterval) return;
          soundState.splitLastAt = nowMs;

          const t = audioContext.currentTime;
          const progress = populationProgress();

          // Higher and glassier while the system is sparse; warmer/lower near MAX.
          const baseFreq =
            THREE.MathUtils.lerp(1080, 610, progress) *
            (0.93 + Math.random() * 0.14);

          const volume =
            THREE.MathUtils.lerp(0.095, 0.040, progress);

          const output = createStereoOutput(worldPosition, volume);
          if (!output) return;

          const osc = audioContext.createOscillator();
          const partial = audioContext.createOscillator();
          const partialGain = audioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(baseFreq, t);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.72, t + 0.105);

          partial.type = "triangle";
          partial.frequency.setValueAtTime(baseFreq * 2.02, t);
          partial.frequency.exponentialRampToValueAtTime(baseFreq * 1.42, t + 0.075);

          output.gain.gain.setValueAtTime(0.0001, t);
          output.gain.gain.exponentialRampToValueAtTime(volume, t + 0.006);
          output.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

          partialGain.gain.setValueAtTime(0.0001, t);
          partialGain.gain.exponentialRampToValueAtTime(volume * 0.28, t + 0.004);
          partialGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);

          osc.connect(output.gain);
          partial.connect(partialGain);
          partialGain.connect(output.gain);

          osc.start(t);
          partial.start(t);
          osc.stop(t + 0.18);
          partial.stop(t + 0.09);

          registerVoice(0.18);
        }

        function playMergeSound(worldPosition) {
          if (
            !audioContext ||
            audioContext.state !== "running" ||
            soundState.activeVoices >= soundState.maxVoices
          ) return;

          const nowMs = performance.now();
          const minInterval =
            particles.length > 100 ? 42 :
            particles.length > 30 ? 30 :
            18;

          if (nowMs - soundState.mergeLastAt < minInterval) return;
          soundState.mergeLastAt = nowMs;

          const t = audioContext.currentTime;
          const compression =
            THREE.MathUtils.clamp(
              1 - currentArenaRadius / MAX_ARENA_RADIUS,
              0,
              1
            );

          // Gets deeper as the sphere contracts.
          const baseFreq =
            THREE.MathUtils.lerp(235, 105, compression) *
            (0.94 + Math.random() * 0.12);

          const volume =
            THREE.MathUtils.lerp(0.075, 0.115, compression);

          const output = createStereoOutput(worldPosition, volume);
          if (!output) return;

          const osc = audioContext.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(baseFreq * 1.28, t);
          osc.frequency.exponentialRampToValueAtTime(baseFreq, t + 0.09);

          output.gain.gain.setValueAtTime(0.0001, t);
          output.gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
          output.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);

          osc.connect(output.gain);
          osc.start(t);
          osc.stop(t + 0.21);

          registerVoice(0.21);
        }

        function playRebirthSound(worldPosition) {
          if (!audioContext || audioContext.state !== "running") return;

          const t = audioContext.currentTime;

          // Momentarily duck ordinary collision density under the rebirth impact.
          if (audioMaster) {
            audioMaster.gain.cancelScheduledValues(t);
            audioMaster.gain.setValueAtTime(0.46, t);
            audioMaster.gain.linearRampToValueAtTime(0.58, t + 0.34);
            audioMaster.gain.linearRampToValueAtTime(MASTER_GAIN, t + 0.90);
          }

          const output = createStereoOutput(worldPosition, 0.19);
          if (!output) return;

          // Deep impact.
          const sub = audioContext.createOscillator();
          sub.type = "sine";
          sub.frequency.setValueAtTime(92, t);
          sub.frequency.exponentialRampToValueAtTime(38, t + 0.48);

          const subGain = audioContext.createGain();
          subGain.gain.setValueAtTime(0.0001, t);
          subGain.gain.exponentialRampToValueAtTime(0.19, t + 0.012);
          subGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);

          sub.connect(subGain);
          subGain.connect(output.gain);

          // Bright "singularity" crack.
          const crack = audioContext.createOscillator();
          crack.type = "triangle";
          crack.frequency.setValueAtTime(1480, t);
          crack.frequency.exponentialRampToValueAtTime(330, t + 0.16);

          const crackGain = audioContext.createGain();
          crackGain.gain.setValueAtTime(0.0001, t);
          crackGain.gain.exponentialRampToValueAtTime(0.085, t + 0.004);
          crackGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);

          crack.connect(crackGain);
          crackGain.connect(output.gain);

          // Short noise bloom / expanding air.
          const bufferLength = Math.max(1, Math.floor(audioContext.sampleRate * 0.48));
          const noiseBuffer = audioContext.createBuffer(
            1,
            bufferLength,
            audioContext.sampleRate
          );
          const data = noiseBuffer.getChannelData(0);

          for (let i = 0; i < bufferLength; i++) {
            const envelope = 1 - i / bufferLength;
            data[i] = (Math.random() * 2 - 1) * envelope;
          }

          const noise = audioContext.createBufferSource();
          noise.buffer = noiseBuffer;

          const noiseFilter = audioContext.createBiquadFilter();
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.setValueAtTime(620, t);
          noiseFilter.frequency.exponentialRampToValueAtTime(180, t + 0.46);
          noiseFilter.Q.value = 0.7;

          const noiseGain = audioContext.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.075, t + 0.025);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(output.gain);

          sub.start(t);
          crack.start(t);
          noise.start(t);

          sub.stop(t + 0.66);
          crack.stop(t + 0.22);
          noise.stop(t + 0.50);

          registerVoice(0.72);
        }

        function playMaxSound() {
          if (!audioContext || audioContext.state !== "running" || !audioMaster) {
            return;
          }

          const t = audioContext.currentTime;

          // Smooth MAX blast:
          // deep sub impact + rounded body + filtered air burst + rumble tail.
          // No square-wave crack, so the peak stays powerful without sounding harsh.

          const eventGain = audioContext.createGain();
          eventGain.gain.setValueAtTime(0.0001, t);
          eventGain.gain.exponentialRampToValueAtTime(0.92, t + 0.018);
          eventGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.10);
          eventGain.connect(audioMaster);

          // SUB IMPACT
          const sub = audioContext.createOscillator();
          const subGain = audioContext.createGain();

          sub.type = "sine";
          sub.frequency.setValueAtTime(112, t);
          sub.frequency.exponentialRampToValueAtTime(38, t + 0.68);

          subGain.gain.setValueAtTime(0.0001, t);
          subGain.gain.exponentialRampToValueAtTime(0.17, t + 0.024);
          subGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.76);

          sub.connect(subGain);
          subGain.connect(eventGain);

          // ROUNDED IMPACT BODY
          const body = audioContext.createOscillator();
          const bodyGain = audioContext.createGain();

          body.type = "sine";
          body.frequency.setValueAtTime(245, t);
          body.frequency.exponentialRampToValueAtTime(92, t + 0.38);

          bodyGain.gain.setValueAtTime(0.0001, t);
          bodyGain.gain.exponentialRampToValueAtTime(0.095, t + 0.018);
          bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);

          body.connect(bodyGain);
          bodyGain.connect(eventGain);

          // SOFT TRANSIENT: replaces the previous square-wave crack.
          const transient = audioContext.createOscillator();
          const transientGain = audioContext.createGain();
          const transientFilter = audioContext.createBiquadFilter();

          transient.type = "triangle";
          transient.frequency.setValueAtTime(980, t);
          transient.frequency.exponentialRampToValueAtTime(310, t + 0.20);

          transientFilter.type = "lowpass";
          transientFilter.frequency.setValueAtTime(1800, t);
          transientFilter.frequency.exponentialRampToValueAtTime(720, t + 0.22);
          transientFilter.Q.value = 0.55;

          transientGain.gain.setValueAtTime(0.0001, t);
          transientGain.gain.exponentialRampToValueAtTime(0.036, t + 0.012);
          transientGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

          transient.connect(transientFilter);
          transientFilter.connect(transientGain);
          transientGain.connect(eventGain);

          // FILTERED AIR BLAST
          const noiseLength = Math.max(
            1,
            Math.floor(audioContext.sampleRate * 0.52)
          );

          const noiseBuffer = audioContext.createBuffer(
            1,
            noiseLength,
            audioContext.sampleRate
          );

          const noiseData = noiseBuffer.getChannelData(0);

          for (let i = 0; i < noiseLength; i++) {
            const x = i / Math.max(1, noiseLength - 1);

            // Smooth attack and decay so the burst has no digital edge.
            const attack = Math.min(1, x / 0.055);
            const decay = Math.pow(1 - x, 1.7);
            const envelope = Math.sin(attack * Math.PI * 0.5) * decay;

            noiseData[i] = (Math.random() * 2 - 1) * envelope;
          }

          const noise = audioContext.createBufferSource();
          noise.buffer = noiseBuffer;

          const noiseFilter = audioContext.createBiquadFilter();
          noiseFilter.type = "lowpass";
          noiseFilter.frequency.setValueAtTime(1700, t);
          noiseFilter.frequency.exponentialRampToValueAtTime(260, t + 0.48);
          noiseFilter.Q.value = 0.42;

          const noiseGain = audioContext.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.070, t + 0.028);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.50);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(eventGain);

          // LOW RUMBLE TAIL
          const rumble = audioContext.createOscillator();
          const rumbleGain = audioContext.createGain();

          rumble.type = "sine";
          rumble.frequency.setValueAtTime(58, t + 0.04);
          rumble.frequency.exponentialRampToValueAtTime(29, t + 1.02);

          rumbleGain.gain.setValueAtTime(0.0001, t);
          rumbleGain.gain.exponentialRampToValueAtTime(0.070, t + 0.09);
          rumbleGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.08);

          rumble.connect(rumbleGain);
          rumbleGain.connect(eventGain);

          sub.start(t);
          body.start(t);
          transient.start(t);
          noise.start(t);
          rumble.start(t + 0.04);

          sub.stop(t + 0.80);
          body.stop(t + 0.52);
          transient.stop(t + 0.28);
          noise.stop(t + 0.54);
          rumble.stop(t + 1.12);

          registerVoice(1.12);
        }

        function playCollisionSound(type, worldPosition) {
          if (type === "split") {
            playSplitSound(worldPosition);
          } else if (type === "merge") {
            playMergeSound(worldPosition);
          } else if (type === "rebirth") {
            playRebirthSound(worldPosition);
          }
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.045);

        const camera = new THREE.PerspectiveCamera(
          48,
          window.innerWidth / window.innerHeight,
          0.1,
          50
        );

        camera.position.set(0.85, 0.38, 8.7);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance"
        });

        const renderPixelRatio = () =>
          Math.min(
            window.devicePixelRatio || 1,
            window.innerWidth < 900 ? 1.35 : 1.65
          );

        renderer.setPixelRatio(renderPixelRatio());
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Pure black opening. The WebGL canvas fades in only after ignition.
        renderer.domElement.style.opacity = "0";
        renderer.domElement.style.transition = "opacity 420ms ease";
        stage.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enabled = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.minPolarAngle = Math.PI * 0.20;
        controls.maxPolarAngle = Math.PI * 0.80;
        controls.rotateSpeed = 0.7;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0;
        controls.target.set(0, 0, 0);
        controls.update();

        // Procedural studio environment: realistic highlights/reflections without image assets.
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const roomEnvironment = new RoomEnvironment();
        const environmentTarget = pmremGenerator.fromScene(roomEnvironment, 0.04);
        scene.environment = environmentTarget.texture;
        pmremGenerator.dispose();
        roomEnvironment.dispose();

        const world = new THREE.Group();
        scene.add(world);

        // Very faint background points help the eye read camera motion and depth.
        const starCount = 140;
        const starPositions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
          const r = 12 + Math.random() * 16;
          const dir = randomDirectionForBackground();

          starPositions[i * 3] = dir.x * r;
          starPositions[i * 3 + 1] = dir.y * r;
          starPositions[i * 3 + 2] = dir.z * r;
        }

        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(starPositions, 3)
        );

        const stars = new THREE.Points(
          starGeometry,
          new THREE.PointsMaterial({
            color: 0xbddfff,
            size: 0.014,
            transparent: true,
            opacity: 0.10,
            depthWrite: false
          })
        );

        scene.add(stars);

        function randomDirectionForBackground() {
          const z = Math.random() * 2 - 1;
          const theta = Math.random() * Math.PI * 2;
          const rr = Math.sqrt(Math.max(0, 1 - z * z));
          return new THREE.Vector3(
            rr * Math.cos(theta),
            rr * Math.sin(theta),
            z
          );
        }

        // Cinematic post-processing: real bloom, subtle depth of field,
        // film grain and vignette. Kept deliberately restrained.
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(renderPixelRatio());
        composer.setSize(window.innerWidth, window.innerHeight);

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bokehPass = new BokehPass(scene, camera, {
          focus: 8.55,
          aperture: window.innerWidth < 900 ? 0.00028 : 0.00042,
          maxblur: window.innerWidth < 900 ? 0.0038 : 0.0058
        });
        composer.addPass(bokehPass);

        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          window.innerWidth < 900 ? 0.58 : 0.78,
          0.42,
          0.72
        );
        composer.addPass(bloomPass);

        const cinematicShader = {
          uniforms: {
            tDiffuse: { value: null },
            time: { value: 0 },
            grainAmount: { value: window.innerWidth < 900 ? 0.016 : 0.012 },
            vignetteAmount: { value: 0.34 }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float time;
            uniform float grainAmount;
            uniform float vignetteAmount;
            varying vec2 vUv;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7)) + time * 0.001) * 43758.5453123);
            }

            void main() {
              vec4 color = texture2D(tDiffuse, vUv);

              float dist = distance(vUv, vec2(0.5));
              float vignette = smoothstep(0.30, 0.73, dist);
              color.rgb *= 1.0 - vignette * vignetteAmount;

              float noise = hash(vUv * vec2(1511.0, 893.0)) - 0.5;
              color.rgb += noise * grainAmount;

              gl_FragColor = color;
            }
          `
        };

        const cinematicPass = new ShaderPass(cinematicShader);
        composer.addPass(cinematicPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // Lighting gives the particles actual volume instead of flat color.
        const ambientLight = new THREE.HemisphereLight(0x8fdcff, 0x140a1f, 1.55);
        scene.add(ambientLight);

        const keyLight = new THREE.PointLight(0xffffff, 48, 22, 2);
        keyLight.position.set(4.6, 5.4, 6.2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        keyLight.shadow.bias = -0.0005;
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0x64cfff, 34, 18, 2);
        rimLight.position.set(-5.2, 2.3, -3.6);
        scene.add(rimLight);

        const warmLight = new THREE.PointLight(0xff6a32, 24, 16, 2);
        warmLight.position.set(3.5, -4.2, -2.5);
        scene.add(warmLight);

        const sphereGeometry = new THREE.SphereGeometry(ARENA_RADIUS, 72, 48);

        // Subtle glass shell: visible enough to define the arena, but not a wireframe cage.
        const boundary = new THREE.Mesh(
          sphereGeometry,
          new THREE.MeshPhysicalMaterial({
            color: 0xbfeaff,
            transparent: true,
            opacity: 0.075,
            roughness: 0.08,
            metalness: 0.0,
            transmission: 0.62,
            thickness: 0.12,
            clearcoat: 1.0,
            clearcoatRoughness: 0.06,
            envMapIntensity: 0.72,
            ior: 1.32,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        boundary.renderOrder = 4;
        world.add(boundary);

        // Inner atmospheric shell adds depth and a faint volume cue.
        const shell = new THREE.Mesh(
          sphereGeometry,
          new THREE.MeshBasicMaterial({
            color: 0x4fbfff,
            transparent: true,
            opacity: 0.018,
            side: THREE.BackSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
        world.add(shell);

        const shockwaveSphere = new THREE.Mesh(
          sphereGeometry,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
        shockwaveSphere.visible = false;
        shockwaveSphere.renderOrder = 5;
        world.add(shockwaveSphere);

        // A faint equatorial ring gives the glass sphere a more believable contour.
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(ARENA_RADIUS * 1.005, 0.007, 8, 160),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.11,
            depthWrite: false
          })
        );
        ring.rotation.x = Math.PI / 2;
        world.add(ring);

        const coreGeometry = new THREE.SphereGeometry(VISUAL_RADIUS, 20, 14);
        const coreMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.24,
          metalness: 0.08,
          emissive: 0x101018,
          emissiveIntensity: 0.25,
          envMapIntensity: 1.05,
          vertexColors: false
        });

        const particleMesh = new THREE.InstancedMesh(
          coreGeometry,
          coreMaterial,
          MAX_ALLOWED
        );
        particleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        particleMesh.count = 0;
        particleMesh.castShadow = true;
        particleMesh.receiveShadow = true;
        world.add(particleMesh);

        const glowGeometry = new THREE.SphereGeometry(VISUAL_RADIUS * 2.7, 10, 7);
        const glowMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.075,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const glowMesh = new THREE.InstancedMesh(
          glowGeometry,
          glowMaterial,
          MAX_ALLOWED
        );
        glowMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        glowMesh.count = 0;
        world.add(glowMesh);

        const MAX_TRAIL_VERTICES = MAX_ALLOWED * 31 * 2;
        const trailPositions = new Float32Array(MAX_TRAIL_VERTICES * 3);
        const trailColors = new Float32Array(MAX_TRAIL_VERTICES * 3);

        const trailGeometry = new THREE.BufferGeometry();
        trailGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(trailPositions, 3).setUsage(THREE.DynamicDrawUsage)
        );
        trailGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(trailColors, 3).setUsage(THREE.DynamicDrawUsage)
        );
        trailGeometry.setDrawRange(0, 0);

        const trailMaterial = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.58,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const trailLines = new THREE.LineSegments(trailGeometry, trailMaterial);
        world.add(trailLines);

        const MAX_SPARKS = 1000;
        const sparkPositions = new Float32Array(MAX_SPARKS * 3);
        const sparkColors = new Float32Array(MAX_SPARKS * 3);
        const sparkGeometry = new THREE.BufferGeometry();

        sparkGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(sparkPositions, 3).setUsage(THREE.DynamicDrawUsage)
        );
        sparkGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(sparkColors, 3).setUsage(THREE.DynamicDrawUsage)
        );
        sparkGeometry.setDrawRange(0, 0);

        const sparkMaterial = new THREE.PointsMaterial({
          size: 0.068,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const sparkPoints = new THREE.Points(sparkGeometry, sparkMaterial);
        world.add(sparkPoints);

        let sparks = [];

        // --------------------------------------------------------
        // Local collision VFX
        // Split = short outward sparks
        // Merge = bright local flash + contracting "implosion" halo
        // --------------------------------------------------------

        const LOCAL_EFFECT_POOL_SIZE = 30;
        const SPLIT_FRAGMENT_POOL_SIZE = 180;

        const mergeEffects = [];
        const splitEffects = [];
        const splitFragments = [];

        function createRadialGlowTexture() {
          const size = 128;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;

          const ctx = canvas.getContext("2d");
          const gradient = ctx.createRadialGradient(
            size * 0.5,
            size * 0.5,
            0,
            size * 0.5,
            size * 0.5,
            size * 0.5
          );

          gradient.addColorStop(0.00, "rgba(255,255,255,1)");
          gradient.addColorStop(0.14, "rgba(255,255,255,0.95)");
          gradient.addColorStop(0.42, "rgba(155,225,255,0.38)");
          gradient.addColorStop(1.00, "rgba(80,160,255,0)");

          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, size, size);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.needsUpdate = true;
          return texture;
        }

        function createRingTexture() {
          const size = 128;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;

          const ctx = canvas.getContext("2d");
          const cx = size * 0.5;
          const cy = size * 0.5;
          const r = size * 0.34;

          const gradient = ctx.createRadialGradient(
            cx, cy, r * 0.74,
            cx, cy, r * 1.28
          );

          gradient.addColorStop(0.00, "rgba(255,255,255,0)");
          gradient.addColorStop(0.40, "rgba(210,245,255,0.05)");
          gradient.addColorStop(0.58, "rgba(235,252,255,0.95)");
          gradient.addColorStop(0.72, "rgba(150,225,255,0.46)");
          gradient.addColorStop(1.00, "rgba(80,150,255,0)");

          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, size, size);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.needsUpdate = true;
          return texture;
        }

        const localGlowTexture = createRadialGlowTexture();
        const mergeWaveTexture = createRingTexture();

        for (let i = 0; i < LOCAL_EFFECT_POOL_SIZE; i++) {
          const splitMaterial = new THREE.SpriteMaterial({
            map: localGlowTexture,
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            depthTest: false
          });

          const splitFlash = new THREE.Sprite(splitMaterial);
          splitFlash.renderOrder = 8;
          splitFlash.visible = false;
          world.add(splitFlash);

          splitEffects.push({
            active: false,
            life: 0,
            maxLife: 0.20,
            flash: splitFlash
          });

          const waveMaterial = new THREE.SpriteMaterial({
            map: mergeWaveTexture,
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            depthTest: false
          });

          const wave = new THREE.Sprite(waveMaterial);
          wave.renderOrder = 8;
          wave.visible = false;
          world.add(wave);

          mergeEffects.push({
            active: false,
            life: 0,
            maxLife: 0.42,
            wave
          });
        }

        for (let i = 0; i < SPLIT_FRAGMENT_POOL_SIZE; i++) {
          const material = new THREE.SpriteMaterial({
            map: localGlowTexture,
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            depthTest: false
          });

          const sprite = new THREE.Sprite(material);
          sprite.renderOrder = 8;
          sprite.visible = false;
          world.add(sprite);

          splitFragments.push({
            active: false,
            life: 0,
            maxLife: 0.24,
            drag: 0.94,
            startScale: 0.04,
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            sprite
          });
        }

        function getAvailableEffect(pool) {
          let effect = pool.find((item) => !item.active);

          if (!effect) {
            effect = pool.reduce((oldest, item) =>
              item.life > oldest.life ? item : oldest
            );
          }

          return effect;
        }

        function spawnSplitDebris(position, baseColor) {
          const white = new THREE.Color(0xffffff);
          const fragmentCount =
            particles.length > 180 ? 7 :
            particles.length > 90 ? 10 :
            particles.length > 30 ? 13 :
            16;

          for (let i = 0; i < fragmentCount; i++) {
            const frag = getAvailableEffect(splitFragments);
            const dir = randomUnitVector();
            const speed = 1.1 + Math.random() * 2.0;

            frag.active = true;
            frag.life = 0;
            frag.maxLife = 0.20 + Math.random() * 0.22;
            frag.drag = 0.90 + Math.random() * 0.05;

            frag.pos.copy(position).addScaledVector(dir, 0.008 + Math.random() * 0.02);
            frag.vel.copy(dir).multiplyScalar(speed);

            frag.sprite.position.copy(frag.pos);
            frag.startScale = 0.038 + Math.random() * 0.038;
            frag.sprite.scale.setScalar(frag.startScale);
            frag.sprite.material.color.copy(
              baseColor.clone().lerp(white, 0.72 + Math.random() * 0.18)
            );
            frag.sprite.material.opacity = 0.9;
            frag.sprite.visible = true;
          }
        }

        function spawnSplitSparks(position) {
          // Strong split cue:
          // central flash + denser/faster sparks + tiny fading debris.
          const sparkCount =
            particles.length > 180 ? 9 :
            particles.length > 90 ? 12 :
            particles.length > 30 ? 16 :
            20;

          const baseColor = populationColor(new THREE.Color());
          const white = new THREE.Color(0xffffff);

          for (let i = 0; i < sparkCount; i++) {
            const dir = randomUnitVector();
            const speed = 1.8 + Math.random() * 2.6;

            sparks.push({
              pos: position.clone().addScaledVector(dir, 0.012),
              vel: dir.multiplyScalar(speed),
              life: 0,
              maxLife: 0.24 + Math.random() * 0.20,
              color: baseColor.clone().lerp(
                white,
                0.66 + Math.random() * 0.24
              )
            });
          }

          const effect = getAvailableEffect(splitEffects);
          effect.active = true;
          effect.life = 0;
          effect.maxLife = 0.17 + Math.random() * 0.05;
          effect.flash.position.copy(position);
          effect.flash.scale.setScalar(0.14);
          effect.flash.material.color.copy(
            baseColor.clone().lerp(white, 0.82)
          );
          effect.flash.material.opacity = 0;
          effect.flash.visible = true;

          spawnSplitDebris(position, baseColor);

          if (!celebration && sparks.length > MAX_SPARKS) {
            sparks.splice(0, sparks.length - MAX_SPARKS);
          }
        }

        function spawnMergeHighlight(position) {
          // A visible ripple expands from the new merged particle and fades out.
          const effect = getAvailableEffect(mergeEffects);
          const color = populationColor(new THREE.Color())
            .lerp(new THREE.Color(0xe8fbff), 0.72);

          effect.active = true;
          effect.life = 0;
          effect.maxLife = 0.36 + Math.random() * 0.10;
          effect.wave.position.copy(position);
          effect.wave.scale.setScalar(0.13);
          effect.wave.material.color.copy(color);
          effect.wave.material.opacity = 0;
          effect.wave.visible = true;
        }

        function updateLocalCollisionEffects(dt) {
          for (const effect of splitEffects) {
            if (!effect.active) continue;

            effect.life += dt;
            const t = THREE.MathUtils.clamp(
              effect.life / effect.maxLife,
              0,
              1
            );

            if (t >= 1) {
              effect.active = false;
              effect.flash.visible = false;
              effect.flash.material.opacity = 0;
              continue;
            }

            const attack = Math.min(1, t / 0.12);
            const envelope =
              Math.sin(attack * Math.PI * 0.5) *
              Math.pow(1 - t, 1.8);

            effect.flash.material.opacity = envelope * 0.98;
            effect.flash.scale.setScalar(
              THREE.MathUtils.lerp(0.12, 0.40, 1 - Math.pow(1 - t, 2))
            );
          }

          for (const frag of splitFragments) {
            if (!frag.active) continue;

            frag.life += dt;
            const t = THREE.MathUtils.clamp(
              frag.life / frag.maxLife,
              0,
              1
            );

            if (t >= 1) {
              frag.active = false;
              frag.sprite.visible = false;
              frag.sprite.material.opacity = 0;
              continue;
            }

            frag.pos.addScaledVector(frag.vel, dt);
            frag.vel.multiplyScalar(Math.pow(frag.drag, dt * 60));

            frag.sprite.position.copy(frag.pos);

            const envelope = Math.pow(1 - t, 1.25);
            frag.sprite.material.opacity = envelope * 0.95;

            frag.sprite.scale.setScalar(
              frag.startScale * THREE.MathUtils.lerp(1.0, 0.48, t)
            );
          }

          for (const effect of mergeEffects) {
            if (!effect.active) continue;

            effect.life += dt;
            const t = THREE.MathUtils.clamp(
              effect.life / effect.maxLife,
              0,
              1
            );

            if (t >= 1) {
              effect.active = false;
              effect.wave.visible = false;
              effect.wave.material.opacity = 0;
              continue;
            }

            const eased = 1 - Math.pow(1 - t, 3);

            effect.wave.scale.setScalar(
              THREE.MathUtils.lerp(0.14, 0.82, eased)
            );

            const appear = Math.min(1, t / 0.10);
            effect.wave.material.opacity =
              appear * Math.pow(1 - t, 1.45) * 0.82;
          }
        }

        function clearLocalCollisionEffects() {
          for (const effect of splitEffects) {
            effect.active = false;
            effect.life = 0;
            effect.flash.visible = false;
            effect.flash.material.opacity = 0;
          }

          for (const frag of splitFragments) {
            frag.active = false;
            frag.life = 0;
            frag.startScale = 0.04;
            frag.vel.set(0, 0, 0);
            frag.sprite.visible = false;
            frag.sprite.material.opacity = 0;
          }

            effect.life = 0;
            effect.wave.visible = false;
            effect.wave.material.opacity = 0;

        }

        const dummy = new THREE.Object3D();
        const tempColor = new THREE.Color();
        const tempColor2 = new THREE.Color();
        const tempV1 = new THREE.Vector3();
        const tempV2 = new THREE.Vector3();
        const tempV3 = new THREE.Vector3();
        const tempNormal = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        const gravityPlane = new THREE.Plane();
        const cameraDirection = new THREE.Vector3();

        const BASE_PARTICLE_COLOR = new THREE.Color(0x5ee7ff);
        const HOT_PARTICLE_COLOR = new THREE.Color(0xff4b35);
        const SPLIT_HEAT_STEP = 0.17;
        const MERGE_COOL_STEP = 0.18;
        const PARTICLE_COLOR_SMOOTHING = 3.2;

        function particleColorFromHeat(heat, target = new THREE.Color()) {
          return target.copy(BASE_PARTICLE_COLOR).lerp(
            HOT_PARTICLE_COLOR,
            THREE.MathUtils.clamp(heat, 0, 1)
          );
        }

        function averageParticleHeat() {
          if (particles.length === 0) return 0;

          let total = 0;
          for (const p of particles) total += p.heat;
          return THREE.MathUtils.clamp(total / particles.length, 0, 1);
        }

        // Retained as the global "temperature" helper for shell/light/VFX,
        // but now driven by the average per-particle color state instead of
        // raw population count.
        function populationProgress() {
          return averageParticleHeat();
        }

        function populationColor(target = new THREE.Color()) {
          return particleColorFromHeat(averageParticleHeat(), target);
        }

        function dampScalar(current, target, smoothingPerSecond, dt) {
          const alpha = 1 - Math.exp(-smoothingPerSecond * dt);
          return current + (target - current) * alpha;
        }


        function randomUnitVector() {
          const z = Math.random() * 2 - 1;
          const theta = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.max(0, 1 - z * z));
          return new THREE.Vector3(
            r * Math.cos(theta),
            r * Math.sin(theta),
            z
          );
        }

        function clampInside(position, margin = VISUAL_RADIUS) {
          const limit = currentArenaRadius - margin;
          const len = position.length();

          if (len > limit && len > 0) {
            position.multiplyScalar(limit / len);
          }

          return position;
        }

        function makeParticle(
          position,
          velocity,
          cooldown = 12,
          heat = 0,
          targetHeat = heat
        ) {
          const p = position.clone();
          clampInside(p, VISUAL_RADIUS + 0.02);

          const clampedHeat = THREE.MathUtils.clamp(heat, 0, 1);
          const clampedTargetHeat = THREE.MathUtils.clamp(targetHeat, 0, 1);
          const c = particleColorFromHeat(clampedHeat, new THREE.Color());

          return {
            id: nextId++,
            pos: p,
            vel: velocity.clone(),
            cooldown,
            heat: clampedHeat,
            targetHeat: clampedTargetHeat,
            history: [p.clone()],
            historyColors: [c.clone()]
          };
        }

        function clearTrails() {
          for (const p of particles) {
            p.history = [p.pos.clone()];
            p.historyColors = [particleColorFromHeat(p.heat, new THREE.Color())];
          }
          trailGeometry.setDrawRange(0, 0);
        }

        function createTwo(origin = new THREE.Vector3()) {
          particles = [];
          nextId = 1;

          const axis = randomUnitVector();
          // Creates a brief ~0.2–0.25s anticipation before first impact.
          const offset = 0.42;

          const aPos = origin.clone().addScaledVector(axis, -offset);
          const bPos = origin.clone().addScaledVector(axis, offset);
          clampInside(aPos, 0.25);
          clampInside(bPos, 0.25);

          const towardB = bPos.clone().sub(aPos).normalize().multiplyScalar(BASE_SPEED);
          const towardA = aPos.clone().sub(bPos).normalize().multiplyScalar(BASE_SPEED);

          particles.push(makeParticle(aPos, towardB, 5));
          particles.push(makeParticle(bPos, towardA, 5));

        }

        function resetAt(worldPoint) {
          mode = "split";
          celebration = null;
          mergeShrinkStarted = 0;
          mergeShrinkStartRadius = MAX_ARENA_RADIUS;
          finalShrinkStarted = 0;
          rebirthStartRadius = MIN_ARENA_RADIUS;
          sparks = [];
          sparkGeometry.setDrawRange(0, 0);
          clearLocalCollisionEffects();
          paused = false;
          started = true;

          const origin = worldPoint ? worldPoint.clone() : new THREE.Vector3();
          clampInside(origin, 0.8);

          createTwo(origin);
          clearTrails();
          lastFrame = performance.now();
        }


        function bounceInsideSphere(particle) {
          const limit = currentArenaRadius - VISUAL_RADIUS;
          const len = particle.pos.length();

          if (len < limit || len === 0) return;

          tempNormal.copy(particle.pos).multiplyScalar(1 / len);
          particle.pos.copy(tempNormal).multiplyScalar(limit - 0.002);

          const outward = particle.vel.dot(tempNormal);

          if (outward > 0) {
            particle.vel.addScaledVector(tempNormal, -2 * outward);
          }
        }

        function updatePointerWorld() {
          if (!pointer.active) return;

          raycaster.setFromCamera(pointer.ndc, camera);

          camera.getWorldDirection(cameraDirection);
          gravityPlane.setFromNormalAndCoplanarPoint(
            cameraDirection,
            new THREE.Vector3(0, 0, 0)
          );

          const hit = raycaster.ray.intersectPlane(gravityPlane, pointer.world);

          if (!hit) {
            pointer.active = false;
            return;
          }

          clampInside(pointer.world, 0.25);
        }

        function applyGravity(particle, dt) {
          // Main interaction model:
          //   drag = orbit
          //   stationary hold = distort
          // Mere pointer hover no longer affects the system.
          const heldLongEnough =
            gesture.down &&
            !gesture.moved &&
            performance.now() - gesture.startedAt >= HOLD_THRESHOLD_MS;

          if (
            !pointer.active ||
            !pointer.pressed ||
            !heldLongEnough ||
            gravityStrength <= 0 ||
            orbiting
          ) return;

          tempV1.copy(pointer.world).sub(particle.pos);

          const distSq = tempV1.lengthSq();
          if (distSq < 0.015) return;

          const distance = Math.sqrt(distSq);
          tempV1.multiplyScalar(1 / distance);

          const normalized = Math.max(0.16, distance / currentArenaRadius);
          const holdBoost =
            pointer.pressed && !orbiting && !gesture.moved ? 2.7 : 1.0;
          const acceleration =
            gravityStrength *
            holdBoost *
            0.88 /
            normalized;

          particle.vel.addScaledVector(tempV1, acceleration * dt);

          const maxSpeed = BASE_SPEED * 2.25;

          const speed = particle.vel.length();

          if (speed > maxSpeed) {
            particle.vel.multiplyScalar(maxSpeed / speed);
          }
        }

        function applyPhaseForce(particle, dt) {
          const len = particle.pos.length();
          if (len < 0.001) return;

          tempV1.copy(particle.pos).multiplyScalar(-1 / len);

          // The merge phase gently converges toward the center so 3D
          // collisions continue even at low populations.
          const strength =
            mode === "merge"
              ? 0.19
              : mode === "final"
                ? 0.0
                : 0.014;

          particle.vel.addScaledVector(tempV1, strength * dt);
        }

        function tetraDirections() {
          const dirs = [
            new THREE.Vector3(1, 1, 1).normalize(),
            new THREE.Vector3(-1, -1, 1).normalize(),
            new THREE.Vector3(-1, 1, -1).normalize(),
            new THREE.Vector3(1, -1, -1).normalize()
          ];

          const q = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
              Math.random() * Math.PI * 2,
              Math.random() * Math.PI * 2,
              Math.random() * Math.PI * 2
            )
          );

          for (const d of dirs) d.applyQuaternion(q);
          return dirs;
        }

        function splitPair(a, b, spawnCount) {
          const center = a.pos.clone().add(b.pos).multiplyScalar(0.5);
          clampInside(center, 0.3);

          const dirs = tetraDirections();
          const out = [];
          const inheritedHeat = THREE.MathUtils.clamp(
            ((a.targetHeat ?? a.heat ?? 0) + (b.targetHeat ?? b.heat ?? 0)) * 0.5,
            0,
            1
          );
          const currentHeat = THREE.MathUtils.clamp(
            ((a.heat ?? inheritedHeat) + (b.heat ?? inheritedHeat)) * 0.5,
            0,
            1
          );
          const hotterTarget = THREE.MathUtils.clamp(
            inheritedHeat + SPLIT_HEAT_STEP,
            0,
            1
          );

          for (let i = 0; i < spawnCount; i++) {
            const dir = dirs[i % dirs.length].clone();

            if (i >= dirs.length) {
              dir.add(randomUnitVector().multiplyScalar(0.35)).normalize();
            }

            const pos = center.clone().addScaledVector(dir, COLLISION_DISTANCE * 0.56);
            clampInside(pos, 0.18);

            const speed = BASE_SPEED * (0.92 + Math.random() * 0.18);
            out.push(makeParticle(
              pos,
              dir.multiplyScalar(speed),
              13,
              currentHeat,
              hotterTarget
            ));
          }

          return out;
        }

        function mergePair(a, b) {
          const pos = a.pos.clone().add(b.pos).multiplyScalar(0.5);
          clampInside(pos, 0.18);

          const vel = a.vel.clone().add(b.vel);
          const inheritedHeat = THREE.MathUtils.clamp(
            ((a.targetHeat ?? a.heat ?? 0) + (b.targetHeat ?? b.heat ?? 0)) * 0.5,
            0,
            1
          );
          const currentHeat = THREE.MathUtils.clamp(
            ((a.heat ?? inheritedHeat) + (b.heat ?? inheritedHeat)) * 0.5,
            0,
            1
          );
          const coolerTarget = THREE.MathUtils.clamp(
            inheritedHeat - MERGE_COOL_STEP,
            0,
            1
          );

          if (vel.lengthSq() < 0.04) {
            vel.copy(randomUnitVector()).multiplyScalar(BASE_SPEED);
          } else {
            vel.normalize().multiplyScalar(BASE_SPEED);
          }

          return makeParticle(pos, vel, 12, currentHeat, coolerTarget);
        }

        function startCelebration(type) {
          celebration = type;
          celebrationStarted = performance.now();

          if (type === "max") {
            playMaxSound();
          }

          spawnCelebrationSparks(type);
        }

        function spawnCelebrationSparks(type) {
          sparks = [];

          const isMax = type === "max";
          const isRebirth = type === "rebirth";

          const targetCount = isMax
            ? Math.min(MAX_SPARKS, Math.max(320, particles.length * 3))
            : isRebirth
              ? 520
              : 220;

          const sparkColor = new THREE.Color(
            isMax ? 0xffd27a : 0x8fe9ff
          );

          for (let i = 0; i < targetCount; i++) {
            const source = particles[i % particles.length];
            const dir = randomUnitVector();

            sparks.push({
              pos: source.pos.clone(),
              vel: dir.multiplyScalar(
                isMax
                  ? 0.65 + Math.random() * 0.9
                  : isRebirth
                    ? 1.1 + Math.random() * 1.4
                    : 0.45 + Math.random() * 0.65
              ),
              life: 0,
              maxLife: 0.8 + Math.random() * 1.4,
              color: sparkColor.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.45)
            });
          }
        }

        function finishCelebration() {
          if (celebration === "max") {
            celebration = null;
            mode = "merge";
            currentArenaRadius = MAX_ARENA_RADIUS;
            mergeShrinkStarted = performance.now();
            mergeShrinkStartRadius = MAX_ARENA_RADIUS;

            for (const p of particles) {
              p.cooldown = Math.floor(Math.random() * 6);
            }
          } else if (celebration === "rebirth") {
            celebration = null;
            mode = "split";
            postExplosionStarted = performance.now();
            currentArenaRadius = MAX_ARENA_RADIUS;
            mergeShrinkStarted = 0;
            mergeShrinkStartRadius = MAX_ARENA_RADIUS;

            for (const p of particles) {
              p.cooldown = 9;
            }
          }

          sparks = [];
          sparkGeometry.setDrawRange(0, 0);
          trailLines.visible = true;
          world.scale.setScalar(1);
        }


        function triggerRebirthCollision(a, b) {
          const center = a.pos.clone().add(b.pos).multiplyScalar(0.5);

          playCollisionSound("rebirth", center);

          // Remember the exact compressed radius at the moment of impact.
          // The rebirth explosion starts from here.
          rebirthStartRadius = currentArenaRadius;

          // The collision itself creates the first four particles of the next cycle.
          const next = splitPair(a, b, 4);

          for (const p of next) {
            p.pos.lerp(center, 0.42);
            p.cooldown = 10;

          particles = next;
          clearTrails();

          mode = "split";
          startCelebration("rebirth");
