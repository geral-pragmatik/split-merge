<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta
    name="description"
    content="Split / Merge 3D — an immersive generative particle system that expands, contracts and explosively rebirths."
  />
  <meta property="og:title" content="Split / Merge 3D" />
  <meta
    property="og:description"
    content="Two particles expand into a hot 3D swarm, celebrate at maximum complexity, then merge and cool back to two."
  />
  <meta property="og:image" content="og-preview.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Split / Merge 3D</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage:active {
      cursor: grabbing;
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      transition: opacity 300ms ease;
      opacity: 0;
    }

    #hud.visible {
      opacity: 1;
    }

    #hudState {
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 3px;
    }

    .error {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .error.show { display: grid; }

    .error div {
      max-width: 560px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="stage" aria-label="Interactive 3D split and merge particle animation"></div>

  <div id="hud">
    <div id="hudState">SPLIT</div>
    <div id="hudCount">PARTICLES: 2 / 256</div>
  </div>

  <div id="error" class="error">
    <div>
      <h2>Split / Merge 3D could not start</h2>
      <p id="errorText">Your browser may not support the required WebGL features.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    (async () => {
      const errorBox = document.getElementById("error");
      const errorText = document.getElementById("errorText");
      const hudEl = document.getElementById("hud");
      const hudStateEl = document.getElementById("hudState");
      const hudCountEl = document.getElementById("hudCount");

      try {
        const stage = document.getElementById("stage");

        const ARENA_RADIUS = 3.0;
        const VISUAL_RADIUS = 0.075;
        const COLLISION_DISTANCE = 0.26;
        const BASE_SPEED = 1.28;
        const MIN_BALLS = 2;
        const MAX_ALLOWED = 512;
        const MAX_EXPANSION_MS = 850;
        const REBIRTH_EXPLOSION_MS = 900;
        const POST_EXPLOSION_SETTLE_MS = 1200;
        const HOLD_THRESHOLD_MS = 220;
        const MOVE_THRESHOLD_PX = 8;

        let maxBalls = 256;
        let gravityStrength = 0.36;
        let trailLength = 18;
        let cameraShake = 0;

        const MAX_ARENA_RADIUS = ARENA_RADIUS * 1.075;
        const MIN_ARENA_RADIUS = ARENA_RADIUS * 0.25;

        let currentArenaRadius = ARENA_RADIUS;
        let postExplosionStarted = 0;
        let mergeShrinkStarted = 0;
        let mergeShrinkStartRadius = MAX_ARENA_RADIUS;
        let finalShrinkStarted = 0;
        let rebirthStartRadius = MIN_ARENA_RADIUS;

        const FINAL_MIN_RADIUS = VISUAL_RADIUS + COLLISION_DISTANCE * 0.5 + 0.005;
        const MERGE_SHRINK_RATE = 0.54;
        const FINAL_SHRINK_RATE = 0.68;

        let particles = [];
        let nextId = 1;
        let mode = "split";
        let celebration = null;
        let celebrationStarted = 0;
        let started = false;
        let paused = false;
        let lastFrame = performance.now();
        let trailTick = 0;

        const gesture = {
          down: false,
          startedAt: 0,
          startX: 0,
          startY: 0,
          moved: false,
          lastTapAt: 0,
          lastTapX: 0,
          lastTapY: 0,
          tapTimer: 0
        };

        const pointer = {
          active: false,
          pressed: false,
          pointerType: "mouse",
          ndc: new THREE.Vector2(0, 0),
          world: new THREE.Vector3(0, 0, 0)
        };

        let orbiting = false;
        let audioContext = null;
        let audioMaster = null;
        let audioCompressor = null;
        let animationLoopStarted = false;

        const soundState = {
          splitLastAt: 0,
          mergeLastAt: 0,
          activeVoices: 0,
          maxVoices: 18
        };

        // Pentatonic / Lydian scale pitch quantization for harmonic generative sound
        const SCALE_FREQS = [
          130.81, 146.83, 164.81, 196.00, 220.00,
          261.63, 293.66, 329.63, 392.00, 440.00,
          523.25, 587.33, 659.25, 783.99, 880.00,
          1046.50, 1174.66, 1318.51, 1567.98, 1760.00
        ];

        function getQuantizedPitch(progress) {
          const clamped = THREE.MathUtils.clamp(progress, 0, 1);
          const index = Math.floor(clamped * (SCALE_FREQS.length - 1));
          return SCALE_FREQS[index];
        }

        async function unlockAudio() {
          try {
            if (!audioContext) {
              const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

              if (!AudioContextClass) {
                console.warn("Singularity audio: Web Audio API unavailable");
                return false;
              }

              audioContext = new AudioContextClass();

              audioMaster = audioContext.createGain();
              audioMaster.gain.value = 0.72;

              audioCompressor = audioContext.createDynamicsCompressor();
              audioCompressor.threshold.value = -18;
              audioCompressor.knee.value = 16;
              audioCompressor.ratio.value = 7;
              audioCompressor.attack.value = 0.003;
              audioCompressor.release.value = 0.18;

              audioMaster.connect(audioCompressor);
              audioCompressor.connect(audioContext.destination);
            }

            if (audioContext.state !== "running") {
              await audioContext.resume();
            }

            return audioContext.state === "running";
          } catch (error) {
            console.error("Singularity audio failed to start:", error);
            return false;
          }
        }

        function playIgnitionSound() {
          if (!audioContext || audioContext.state !== "running" || !audioMaster) return;

          const t = audioContext.currentTime;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

          osc.connect(gain);
          gain.connect(audioMaster);

          osc.start(t);
          osc.stop(t + 0.24);
        }

        function createStereoOutput(worldPosition, gainValue) {
          if (!audioContext || !audioMaster) return null;

          const gain = audioContext.createGain();
          gain.gain.value = gainValue;

          let tailNode = gain;

          if (audioContext.createStereoPanner && worldPosition) {
            const projected = worldPosition.clone().project(camera);
            const pan = audioContext.createStereoPanner();
            pan.pan.value = THREE.MathUtils.clamp(projected.x, -0.85, 0.85);
            gain.connect(pan);
            pan.connect(audioMaster);
            tailNode = gain;
          } else {
            gain.connect(audioMaster);
          }

          return { gain, tailNode };
        }

        function registerVoice(durationSeconds) {
          soundState.activeVoices++;
          window.setTimeout(() => {
            soundState.activeVoices = Math.max(0, soundState.activeVoices - 1);
          }, Math.ceil(durationSeconds * 1000) + 80);
        }

        function playSplitSound(worldPosition) {
          if (
            !audioContext ||
            audioContext.state !== "running" ||
            soundState.activeVoices >= soundState.maxVoices
          ) return;

          const nowMs = performance.now();
          const minInterval =
            particles.length > 180 ? 48 :
            particles.length > 90 ? 34 :
            20;

          if (nowMs - soundState.splitLastAt < minInterval) return;
          soundState.splitLastAt = nowMs;

          const t = audioContext.currentTime;
          const progress = populationProgress();

          const baseFreq = getQuantizedPitch(progress) * (0.97 + Math.random() * 0.06);
          const volume = THREE.MathUtils.lerp(0.095, 0.040, progress);

          const output = createStereoOutput(worldPosition, volume);
          if (!output) return;

          const osc = audioContext.createOscillator();
          const partial = audioContext.createOscillator();
          const partialGain = audioContext.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(baseFreq, t);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.72, t + 0.105);

          partial.type = "triangle";
          partial.frequency.setValueAtTime(baseFreq * 2.02, t);
          partial.frequency.exponentialRampToValueAtTime(baseFreq * 1.42, t + 0.075);

          output.gain.gain.setValueAtTime(0.0001, t);
          output.gain.gain.exponentialRampToValueAtTime(volume, t + 0.006);
          output.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

          partialGain.gain.setValueAtTime(0.0001, t);
          partialGain.gain.exponentialRampToValueAtTime(volume * 0.28, t + 0.004);
          partialGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);

          osc.connect(output.gain);
          partial.connect(partialGain);
          partialGain.connect(output.gain);

          osc.start(t);
          partial.start(t);
          osc.stop(t + 0.18);
          partial.stop(t + 0.09);

          registerVoice(0.18);

          if ("vibrate" in navigator && Math.random() < 0.2) {
            navigator.vibrate(5);
          }
        }

        function playMergeSound(worldPosition) {
          if (
            !audioContext ||
            audioContext.state !== "running" ||
            soundState.activeVoices >= soundState.maxVoices
          ) return;

          const nowMs = performance.now();
          const minInterval =
            particles.length > 100 ? 42 :
            particles.length > 30 ? 30 :
            18;

          if (nowMs - soundState.mergeLastAt < minInterval) return;
          soundState.mergeLastAt = nowMs;

          const t = audioContext.currentTime;
          const compression = THREE.MathUtils.clamp(
            1 - currentArenaRadius / MAX_ARENA_RADIUS,
            0,
            1
          );

          const baseFreq = getQuantizedPitch(1 - compression) * 0.5 * (0.97 + Math.random() * 0.06);
          const volume = THREE.MathUtils.lerp(0.075, 0.115, compression);

          const output = createStereoOutput(worldPosition, volume);
          if (!output) return;

          const osc = audioContext.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(baseFreq * 1.28, t);
          osc.frequency.exponentialRampToValueAtTime(baseFreq, t + 0.09);

          output.gain.gain.setValueAtTime(0.0001, t);
          output.gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
          output.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);

          osc.connect(output.gain);
          osc.start(t);
          osc.stop(t + 0.21);

          registerVoice(0.21);

          if ("vibrate" in navigator && Math.random() < 0.25) {
            navigator.vibrate(8);
          }
        }

        function playRebirthSound(worldPosition) {
          cameraShake = 0.55;
          if ("vibrate" in navigator) {
            navigator.vibrate([15, 30, 60]);
          }

          if (!audioContext || audioContext.state !== "running") return;

          const t = audioContext.currentTime;

          if (audioMaster) {
            audioMaster.gain.cancelScheduledValues(t);
            audioMaster.gain.setValueAtTime(0.46, t);
            audioMaster.gain.linearRampToValueAtTime(0.58, t + 0.34);
            audioMaster.gain.linearRampToValueAtTime(0.52, t + 0.90);
          }

          const output = createStereoOutput(worldPosition, 0.19);
          if (!output) return;

          const sub = audioContext.createOscillator();
          sub.type = "sine";
          sub.frequency.setValueAtTime(92, t);
          sub.frequency.exponentialRampToValueAtTime(38, t + 0.48);

          const subGain = audioContext.createGain();
          subGain.gain.setValueAtTime(0.0001, t);
          subGain.gain.exponentialRampToValueAtTime(0.19, t + 0.012);
          subGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);

          sub.connect(subGain);
          subGain.connect(output.gain);

          const crack = audioContext.createOscillator();
          crack.type = "triangle";
          crack.frequency.setValueAtTime(1480, t);
          crack.frequency.exponentialRampToValueAtTime(330, t + 0.16);

          const crackGain = audioContext.createGain();
          crackGain.gain.setValueAtTime(0.0001, t);
          crackGain.gain.exponentialRampToValueAtTime(0.085, t + 0.004);
          crackGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);

          crack.connect(crackGain);
          crackGain.connect(output.gain);

          const bufferLength = Math.max(1, Math.floor(audioContext.sampleRate * 0.48));
          const noiseBuffer = audioContext.createBuffer(1, bufferLength, audioContext.sampleRate);
          const data = noiseBuffer.getChannelData(0);

          for (let i = 0; i < bufferLength; i++) {
            const envelope = 1 - i / bufferLength;
            data[i] = (Math.random() * 2 - 1) * envelope;
          }

          const noise = audioContext.createBufferSource();
          noise.buffer = noiseBuffer;

          const noiseFilter = audioContext.createBiquadFilter();
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.setValueAtTime(620, t);
          noiseFilter.frequency.exponentialRampToValueAtTime(180, t + 0.46);
          noiseFilter.Q.value = 0.7;

          const noiseGain = audioContext.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.075, t + 0.025);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(output.gain);

          sub.start(t);
          crack.start(t);
          noise.start(t);

          sub.stop(t + 0.66);
          crack.stop(t + 0.22);
          noise.stop(t + 0.50);

          registerVoice(0.72);
        }

        function playMaxSound() {
          cameraShake = 0.40;
          if ("vibrate" in navigator) {
            navigator.vibrate([30, 20, 50]);
          }

          if (!audioContext || audioContext.state !== "running" || !audioMaster) return;

          const t = audioContext.currentTime;

          audioMaster.gain.cancelScheduledValues(t);
          audioMaster.gain.setValueAtTime(0.46, t);
          audioMaster.gain.linearRampToValueAtTime(0.62, t + 0.055);
          audioMaster.gain.linearRampToValueAtTime(0.52, t + 0.85);

          const sub = audioContext.createOscillator();
          const subGain = audioContext.createGain();

          sub.type = "sine";
          sub.frequency.setValueAtTime(118, t);
          sub.frequency.exponentialRampToValueAtTime(42, t + 0.62);

          subGain.gain.setValueAtTime(0.0001, t);
          subGain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
          subGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);

          sub.connect(subGain);
          subGain.connect(audioMaster);

          const body = audioContext.createOscillator();
          const bodyGain = audioContext.createGain();

          body.type = "triangle";
          body.frequency.setValueAtTime(210, t);
          body.frequency.exponentialRampToValueAtTime(72, t + 0.34);

          bodyGain.gain.setValueAtTime(0.0001, t);
          bodyGain.gain.exponentialRampToValueAtTime(0.14, t + 0.008);
          bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

          body.connect(bodyGain);
          bodyGain.connect(audioMaster);

          const crack = audioContext.createOscillator();
          crack.type = "square";
          crack.frequency.setValueAtTime(1850, t);
          crack.frequency.exponentialRampToValueAtTime(420, t + 0.095);

          const crackGain = audioContext.createGain();
          crackGain.gain.setValueAtTime(0.0001, t);
          crackGain.gain.exponentialRampToValueAtTime(0.055, t + 0.002);
          crackGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);

          crack.connect(crackGain);
          crackGain.connect(audioMaster);

          const noiseLength = Math.max(1, Math.floor(audioContext.sampleRate * 0.38));
          const noiseBuffer = audioContext.createBuffer(1, noiseLength, audioContext.sampleRate);
          const noiseData = noiseBuffer.getChannelData(0);

          for (let i = 0; i < noiseLength; i++) {
            const x = i / noiseLength;
            const envelope = Math.pow(1 - x, 2.2);
            noiseData[i] = (Math.random() * 2 - 1) * envelope;
          }

          const noise = audioContext.createBufferSource();
          noise.buffer = noiseBuffer;

          const noiseFilter = audioContext.createBiquadFilter();
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.setValueAtTime(900, t);
          noiseFilter.frequency.exponentialRampToValueAtTime(260, t + 0.34);
          noiseFilter.Q.value = 0.55;

          const noiseGain = audioContext.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.12, t + 0.006);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(audioMaster);

          const rumble = audioContext.createOscillator();
          const rumbleGain = audioContext.createGain();

          rumble.type = "sine";
          rumble.frequency.setValueAtTime(62, t + 0.05);
          rumble.frequency.exponentialRampToValueAtTime(31, t + 0.95);

          rumbleGain.gain.setValueAtTime(0.0001, t);
          rumbleGain.gain.exponentialRampToValueAtTime(0.085, t + 0.08);
          rumbleGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);

          rumble.connect(rumbleGain);
          rumbleGain.connect(audioMaster);

          sub.start(t);
          body.start(t);
          crack.start(t);
          noise.start(t);
          rumble.start(t + 0.05);

          sub.stop(t + 0.75);
          body.stop(t + 0.46);
          crack.stop(t + 0.13);
          noise.stop(t + 0.40);
          rumble.stop(t + 1.05);

          registerVoice(1.05);
        }

        function playCollisionSound(type, worldPosition) {
          if (type === "split") {
            playSplitSound(worldPosition);
          } else if (type === "merge") {
            playMergeSound(worldPosition);
          } else if (type === "rebirth") {
            playRebirthSound(worldPosition);
          }
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.045);

        const camera = new THREE.PerspectiveCamera(
          48,
          window.innerWidth / window.innerHeight,
          0.1,
          50
        );

        camera.position.set(0.85, 0.38, 8.7);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance"
        });

        const renderPixelRatio = () =>
          Math.min(
            window.devicePixelRatio || 1,
            window.innerWidth < 900 ? 1.35 : 1.65
          );

        renderer.setPixelRatio(renderPixelRatio());
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        renderer.domElement.style.opacity = "0";
        renderer.domElement.style.transition = "opacity 420ms ease";
        stage.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enabled = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.minPolarAngle = Math.PI * 0.20;
        controls.maxPolarAngle = Math.PI * 0.80;
        controls.rotateSpeed = 0.7;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.38;
        controls.target.set(0, 0, 0);
        controls.update();

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const roomEnvironment = new RoomEnvironment();
        const environmentTarget = pmremGenerator.fromScene(roomEnvironment, 0.04);
        scene.environment = environmentTarget.texture;
        pmremGenerator.dispose();
        roomEnvironment.dispose();

        const world = new THREE.Group();
        scene.add(world);

        const starCount = 140;
        const starPositions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
          const r = 12 + Math.random() * 16;
          const dir = randomDirectionForBackground();

          starPositions[i * 3] = dir.x * r;
          starPositions[i * 3 + 1] = dir.y * r;
          starPositions[i * 3 + 2] = dir.z * r;
        }

        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));

        const stars = new THREE.Points(
          starGeometry,
          new THREE.PointsMaterial({
            color: 0xbddfff,
            size: 0.014,
            transparent: true,
            opacity: 0.10,
            depthWrite: false
          })
        );
        scene.add(stars);

        function randomDirectionForBackground() {
          const z = Math.random() * 2 - 1;
          const theta = Math.random() * Math.PI * 2;
          const rr = Math.sqrt(Math.max(0, 1 - z * z));
          return new THREE.Vector3(rr * Math.cos(theta), rr * Math.sin(theta), z);
        }

        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(renderPixelRatio());
        composer.setSize(window.innerWidth, window.innerHeight);

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bokehPass = new BokehPass(scene, camera, {
          focus: 8.55,
          aperture: window.innerWidth < 900 ? 0.00028 : 0.00042,
          maxblur: window.innerWidth < 900 ? 0.0038 : 0.0058
        });
        composer.addPass(bokehPass);

        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          window.innerWidth < 900 ? 0.58 : 0.78,
          0.42,
          0.72
        );
        composer.addPass(bloomPass);

        const cinematicShader = {
          uniforms: {
            tDiffuse: { value: null },
            time: { value: 0 },
            grainAmount: { value: window.innerWidth < 900 ? 0.016 : 0.012 },
            vignetteAmount: { value: 0.34 }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {

              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }

          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float time;
            uniform float grainAmount;
            uniform float vignetteAmount;
            varying vec2 vUv;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7)) + time * 0.001) * 43758.5453123);
            }

            void main() {
              vec4 color = texture2D(tDiffuse, vUv);
              float dist = distance(vUv, vec2(0.5));
              float vignette = smoothstep(0.30, 0.73, dist);
              color.rgb *= 1.0 - vignette * vignetteAmount;
              float noise = hash(vUv * vec2(1511.0, 893.0)) - 0.5;
              color.rgb += noise * grainAmount;
              gl_FragColor = color;
            }
          `
        };

        const cinematicPass = new ShaderPass(cinematicShader);
        composer.addPass(cinematicPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        const ambientLight = new THREE.HemisphereLight(0x8fdcff, 0x140a1f, 1.55);

        const MAX_TRAIL_VERTICES = MAX_ALLOWED * 31 * 2;
        const trailPositions = new Float32Array(MAX_TRAIL_VERTICES * 3);
        const trailColors = new Float32Array(MAX_TRAIL_VERTICES * 3);

        const trailGeometry = new THREE.BufferGeometry();

        trailGeometry.setAttribute("color", new THREE.BufferAttribute(trailColors, 3).setUsage(THREE.DynamicDrawUsage));

        const trailMaterial = new THREE.LineBasicMaterial({

        const MAX_SPARKS = 1000;
        const sparkPositions = new Float32Array(MAX_SPARKS * 3);
        const sparkColors = new Float32Array(MAX_SPARKS * 3);
        const sparkGeometry = new THREE.BufferGeometry();

        sparkGeometry.setAttribute("position", new THREE.BufferAttribute(sparkPositions, 3).setUsage(THREE.DynamicDrawUsage));
        sparkGeometry.setAttribute("color", new THREE.BufferAttribute(sparkColors, 3).setUsage(THREE.DynamicDrawUsage));
        sparkGeometry.setDrawRange(0, 0);

        const sparkMaterial = new THREE.PointsMaterial({
          size: 0.055,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const sparkPoints = new THREE.Points(sparkGeometry, sparkMaterial);
        world.add(sparkPoints);

        let sparks = [];

        const dummy = new THREE.Object3D();
        const tempColor = new THREE.Color();
        const tempColor2 = new THREE.Color();
        const tempV1 = new THREE.Vector3();
        const tempV2 = new THREE.Vector3();
        const tempV3 = new THREE.Vector3();
        const tempNormal = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        const gravityPlane = new THREE.Plane();
        const cameraDirection = new THREE.Vector3();

        const colorStops = [
          new THREE.Color(0x49b8ff),
          new THREE.Color(0x5ee7ff),
          new THREE.Color(0xaa66ff),
          new THREE.Color(0xffa13d),
          new THREE.Color(0xff4b35)
        ];

        function populationProgress() {
          if (maxBalls <= MIN_BALLS) return 0;
          return THREE.MathUtils.clamp((particles.length - MIN_BALLS) / (maxBalls - MIN_BALLS), 0, 1);
        }

        function populationColor(target = new THREE.Color()) {
          const p = populationProgress();
          const scaled = p * (colorStops.length - 1);
          const i = Math.min(colorStops.length - 2, Math.floor(scaled));
          const t = scaled - i;

          target.copy(colorStops[i]).lerp(colorStops[i + 1], t);
          return target;
        }

        function randomUnitVector() {
          const z = Math.random() * 2 - 1;
          const theta = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.max(0, 1 - z * z));
          return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z);
        }

        function clampInside(position, margin = VISUAL_RADIUS) {
          const limit = currentArenaRadius - margin;
          const len = position.length();

          if (len > limit && len > 0) {
            position.multiplyScalar(limit / len);
          }

          return position;
        }

        function makeParticle(position, velocity, cooldown = 12) {
          const p = position.clone();
          clampInside(p, VISUAL_RADIUS + 0.02);

          const c = populationColor(new THREE.Color());

          return {
            id: nextId++,
            pos: p,
            vel: velocity.clone(),
            cooldown,
            history: [p.clone()],
            historyColors: [c.clone()]
          };
        }

        function clearTrails() {
          for (const p of particles) {
            p.history = [p.pos.clone()];
            p.historyColors = [populationColor(new THREE.Color())];
          }
          trailGeometry.setDrawRange(0, 0);
        }

        function createTwo(origin = new THREE.Vector3()) {
          particles = [];
          nextId = 1;

          const axis = randomUnitVector();
          const offset = 0.42;

          const aPos = origin.clone().addScaledVector(axis, -offset);
          const bPos = origin.clone().addScaledVector(axis, offset);
          clampInside(aPos, 0.25);
          clampInside(bPos, 0.25);

          const towardB = bPos.clone().sub(aPos).normalize().multiplyScalar(BASE_SPEED);
          const towardA = aPos.clone().sub(bPos).normalize().multiplyScalar(BASE_SPEED);

          particles.push(makeParticle(aPos, towardB, 5));
          particles.push(makeParticle(bPos, towardA, 5));

          updateUI();
        }

        function resetAt(worldPoint) {
          mode = "split";
          celebration = null;
          mergeShrinkStarted = 0;
          mergeShrinkStartRadius = MAX_ARENA_RADIUS;
          finalShrinkStarted = 0;
          rebirthStartRadius = MIN_ARENA_RADIUS;
          sparks = [];
          sparkGeometry.setDrawRange(0, 0);
          paused = false;
          started = true;

          const origin = worldPoint ? worldPoint.clone() : new THREE.Vector3();
          clampInside(origin, 0.8);

          createTwo(origin);
          clearTrails();
          lastFrame = performance.now();
        }

        function updateUI() {
          if (!hudStateEl || !hudCountEl) return;
          let stateText = mode.toUpperCase();
          if (celebration === "max") stateText = "MAX EXPANSION";
          else if (celebration === "rebirth") stateText = "SINGULARITY REBIRTH";
          else if (mode === "final") stateText = "FINAL COMPRESSION";

          hudStateEl.textContent = stateText;
          hudCountEl.textContent = `PARTICLES: ${particles.length} / ${maxBalls}`;
        }

        function bounceInsideSphere(particle) {
          const limit = currentArenaRadius - VISUAL_RADIUS;
          const len = particle.pos.length();

          if (len < limit || len === 0) return;

          tempNormal.copy(particle.pos).multiplyScalar(1 / len);
          particle.pos.copy(tempNormal).multiplyScalar(limit - 0.002);

          const outward = particle.vel.dot(tempNormal);

          if (outward > 0) {
            particle.vel.addScaledVector(tempNormal, -2 * outward);
          }
        }

        function updatePointerWorld() {
          if (!pointer.active) return;

          raycaster.setFromCamera(pointer.ndc, camera);
          camera.getWorldDirection(cameraDirection);
          gravityPlane.setFromNormalAndCoplanarPoint(cameraDirection, new THREE.Vector3(0, 0, 0));

          const hit = raycaster.ray.intersectPlane(gravityPlane, pointer.world);

          if (!hit) {
            pointer.active = false;
            return;
          }

          clampInside(pointer.world, 0.25);
        }

        function applyGravity(particle, dt) {
          const heldLongEnough =
            gesture.down &&
            !gesture.moved &&
            performance.now() - gesture.startedAt >= HOLD_THRESHOLD_MS;

          if (
            !pointer.active ||
            !pointer.pressed ||
            !heldLongEnough ||
            gravityStrength <= 0 ||
            orbiting
          ) return;

          tempV1.copy(pointer.world).sub(particle.pos);

          const distSq = tempV1.lengthSq();
          if (distSq < 0.015) return;

          const distance = Math.sqrt(distSq);
          tempV1.multiplyScalar(1 / distance);

          const normalized = Math.max(0.16, distance / currentArenaRadius);
          const holdBoost = pointer.pressed && !orbiting && !gesture.moved ? 2.7 : 1.0;
          const acceleration = gravityStrength * holdBoost * 0.88 / normalized;

          particle.vel.addScaledVector(tempV1, acceleration * dt);

          const maxSpeed = BASE_SPEED * 2.25;
          const speed = particle.vel.length();

          if (speed > maxSpeed) {
            particle.vel.multiplyScalar(maxSpeed / speed);
          }
        }

        function applyPhaseForce(particle, dt) {
          const len = particle.pos.length();
          if (len < 0.001) return;

          tempV1.copy(particle.pos).multiplyScalar(-1 / len);

          const strength =
            mode === "merge"
              ? 0.19
              : mode === "final"
                ? 0.0
                : 0.014;

          particle.vel.addScaledVector(tempV1, strength * dt);
        }

        function tetraDirections() {
          const dirs = [
            new THREE.Vector3(1, 1, 1).normalize(),
            new THREE.Vector3(-1, -1, 1).normalize(),
            new THREE.Vector3(-1, 1, -1).normalize(),
            new THREE.Vector3(1, -1, -1).normalize()
          ];

          const q = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
              Math.random() * Math.PI * 2,
              Math.random() * Math.PI * 2,
              Math.random() * Math.PI * 2
            )
          );

          for (const d of dirs) d.applyQuaternion(q);
          return dirs;
        }

        function splitPair(a, b, spawnCount) {
          const center = a.pos.clone().add(b.pos).multiplyScalar(0.5);
          clampInside(center, 0.3);

          const dirs = tetraDirections();
          const out = [];

          for (let i = 0; i < spawnCount; i++) {
            const dir = dirs[i % dirs.length].clone();

            if (i >= dirs.length) {
              dir.add(randomUnitVector().multiplyScalar(0.35)).normalize();
            }

            const pos = center.clone().addScaledVector(dir, COLLISION_DISTANCE * 0.56);
            clampInside(pos, 0.18);

            const speed = BASE_SPEED * (0.92 + Math.random() * 0.18);
            out.push(makeParticle(pos, dir.multiplyScalar(speed), 13));
          }

          return out;
        }

        function mergePair(a, b) {
          const pos = a.pos.clone().add(b.pos).multiplyScalar(0.5);
          clampInside(pos, 0.18);

          const vel = a.vel.clone().add(b.vel);

          if (vel.lengthSq() < 0.04) {
            vel.copy(randomUnitVector()).multiplyScalar(BASE_SPEED);
          } else {
            vel.normalize().multiplyScalar(BASE_SPEED);
          }

          return makeParticle(pos, vel, 12);
        }

        function startCelebration(type) {
          celebration = type;
          celebrationStarted = performance.now();

          if (type === "max") {
            playMaxSound();
          }

          spawnCelebrationSparks(type);
          updateUI();
        }

        function spawnCelebrationSparks(type) {
          sparks = [];

          const isMax = type === "max";
          const isRebirth = type === "rebirth";

          const targetCount = isMax
            ? Math.min(MAX_SPARKS, Math.max(320, particles.length * 3))
            : isRebirth
              ? 520
              : 220;

          const sparkColor = new THREE.Color(isMax ? 0xffd27a : 0x8fe9ff);

          for (let i = 0; i < targetCount; i++) {
            const source = particles[i % particles.length];
            const dir = randomUnitVector();

            sparks.push({
              pos: source.pos.clone(),
              vel: dir.multiplyScalar(
                isMax
                  ? 0.65 + Math.random() * 0.9
                  : isRebirth
                    ? 1.1 + Math.random() * 1.4
                    : 0.45 + Math.random() * 0.65
              ),
              life: 0,
              maxLife: 0.8 + Math.random() * 1.4,
              color: sparkColor.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.45)
            });
          }
        }

        function finishCelebration() {
          if (celebration === "max") {
            celebration = null;
            mode = "merge";
            currentArenaRadius = MAX_ARENA_RADIUS;
            mergeShrinkStarted = performance.now();
            mergeShrinkStartRadius = MAX_ARENA_RADIUS;

            for (const p of particles) {
              p.cooldown = Math.floor(Math.random() * 6);
            }
          } else if (celebration === "rebirth") {
            celebration = null;
            mode = "split";
            postExplosionStarted = performance.now();
            currentArenaRadius = MAX_ARENA_RADIUS;
            mergeShrinkStarted = 0;
            mergeShrinkStartRadius = MAX_ARENA_RADIUS;

            for (const p of particles) {
              p.cooldown = 9;
            }
          }

          sparks = [];
          sparkGeometry.setDrawRange(0, 0);
          trailLines.visible = true;
          world.scale.setScalar(1);
          updateUI();
        }

        function triggerRebirthCollision(a, b) {
          const center = a.pos.clone().add(b.pos).multiplyScalar(0.5);

          playCollisionSound("rebirth", center);

          rebirthStartRadius = currentArenaRadius;
          finalShrinkStarted = 0;

          const next = splitPair(a, b, 4);

          for (const p of next) {
            p.pos.lerp(center, 0.42);
            p.cooldown = 10;
          }

          particles = next;
          clearTrails();

          mode = "split";
          startCelebration("rebirth");
        }

        function processCollisions() {
          if (particles.length < 2) return;

          const thresholdSq = COLLISION_DISTANCE * COLLISION_DISTANCE;

          if (mode === "final" && particles.length === 2) {
            const a = particles[0];
            const b = particles[1];

            if (a.cooldown <= 0 && b.cooldown <= 0) {
              tempV1.copy(b.pos).sub(a.pos);
              const distSq = tempV1.lengthSq();

              if (distSq > 0 && distSq <= thresholdSq) {
                tempNormal.copy(tempV1).normalize();
                tempV2.copy(b.vel).sub(a.vel);

                if (tempV2.dot(tempNormal) < 0) {
                  triggerRebirthCollision(a, b);
                }
              }
            }

            return;
          }

          const removed = new Set();
          const additions = [];
          let projectedCount = particles.length;

          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];

            if (removed.has(a.id) || a.cooldown > 0) continue;

            for (let j = i + 1; j < particles.length; j++) {
              const b = particles[j];

              if (removed.has(b.id) || b.cooldown > 0) continue;

              tempV1.copy(b.pos).sub(a.pos);
              const distSq = tempV1.lengthSq();

              if (distSq > thresholdSq || distSq === 0) continue;

              tempNormal.copy(tempV1).normalize();

              tempV2.copy(b.vel).sub(a.vel);
              const closing = tempV2.dot(tempNormal);

              if (closing >= 0) continue;

              removed.add(a.id);
              removed.add(b.id);

              if (mode === "split") {
                const currentAfterRemoval = projectedCount - 2;
                const room = maxBalls - currentAfterRemoval;
                const spawnCount = Math.max(2, Math.min(4, room));
                const collisionPoint = a.pos.clone().add(b.pos).multiplyScalar(0.5);

                playCollisionSound("split", collisionPoint);

                additions.push(...splitPair(a, b, spawnCount));
                projectedCount = currentAfterRemoval + spawnCount;
              } else if (mode === "merge") {
                const collisionPoint = a.pos.clone().add(b.pos).multiplyScalar(0.5);

                playCollisionSound("merge", collisionPoint);

                additions.push(mergePair(a, b));
                projectedCount -= 1;
              }

              break;
            }
          }

          if (removed.size === 0) return;

          particles = particles.filter((p) => !removed.has(p.id));
          particles.push(...additions);
          updateUI();

          if (mode === "split" && particles.length >= maxBalls) {
            particles = particles.slice(0, maxBalls);
            startCelebration("max");
            return;
          }

          if (mode === "merge" && particles.length <= MIN_BALLS) {
            particles = particles.slice(0, MIN_BALLS);
            mergeShrinkStartRadius = currentArenaRadius;
            finalShrinkStarted = performance.now();
            mode = "final";
            updateUI();
            return;
          }
        }

        function recordTrail(particle) {
          particle.history.unshift(particle.pos.clone());
          particle.historyColors.unshift(populationColor(new THREE.Color()));

          if (particle.history.length > trailLength) {
            particle.history.length = trailLength;
            particle.historyColors.length = trailLength;
          }
        }

        function updateTrails() {
          let vertexIndex = 0;

          for (const particle of particles) {
            const history = particle.history;
            const historyColors = particle.historyColors;
            const segmentCount = Math.min(history.length - 1, trailLength - 1);

            for (let i = 0; i < segmentCount; i++) {
              if (vertexIndex + 2 >= MAX_TRAIL_VERTICES) break;

              const p1 = history[i];
              const p2 = history[i + 1];

              const fade1 = 1 - i / Math.max(1, trailLength);
              const fade2 = 1 - (i + 1) / Math.max(1, trailLength);

              const c1 = historyColors[i] || populationColor(tempColor);
              const c2 = historyColors[i + 1] || c1;

              const base1 = vertexIndex * 3;
              trailPositions[base1] = p1.x;
              trailPositions[base1 + 1] = p1.y;
              trailPositions[base1 + 2] = p1.z;

              trailColors[base1] = c1.r * fade1;
              trailColors[base1 + 1] = c1.g * fade1;
              trailColors[base1 + 2] = c1.b * fade1;

              vertexIndex++;

              const base2 = vertexIndex * 3;
              trailPositions[base2] = p2.x;
              trailPositions[base2 + 1] = p2.y;
              trailPositions[base2 + 2] = p2.z;

              trailColors[base2] = c2.r * fade2 * 0.74;
              trailColors[base2 + 1] = c2.g * fade2 * 0.74;
              trailColors[base2 + 2] = c2.b * fade2 * 0.74;

              vertexIndex++;
            }
          }

          trailGeometry.setDrawRange(0, vertexIndex);
          trailGeometry.attributes.position.needsUpdate = true;
          trailGeometry.attributes.color.needsUpdate = true;
        }

        function updateSparks(dt) {
          if (sparks.length === 0) {
            sparkGeometry.setDrawRange(0, 0);
            return;
          }

          let count = 0;

          for (const s of sparks) {
            s.life += dt;
            if (s.life >= s.maxLife) continue;

            s.pos.addScaledVector(s.vel, dt);
            s.vel.multiplyScalar(Math.pow(0.965, dt * 60));

            const lifeFade = 1 - s.life / s.maxLife;
            const base = count * 3;

            sparkPositions[base] = s.pos.x;
            sparkPositions[base + 1] = s.pos.y;
            sparkPositions[base + 2] = s.pos.z;

            sparkColors[base] = s.color.r * lifeFade;
            sparkColors[base + 1] = s.color.g * lifeFade;
            sparkColors[base + 2] = s.color.b * lifeFade;

            count++;
            if (count >= MAX_SPARKS) break;
          }

          sparkGeometry.setDrawRange(0, count);
          sparkGeometry.attributes.position.needsUpdate = true;
          sparkGeometry.attributes.color.needsUpdate = true;

          sparks = sparks.filter((s) => s.life < s.maxLife);

          if (celebration && sparks.length < 70) {
            spawnCelebrationSparks(celebration);
          }
        }

        function updatePhysics(dt, now) {
          updatePointerWorld();

          if (!started || paused) {
            updateSparks(dt);
            return;
          }

          if (celebration) {
            updateSparks(dt);

            const duration =
              celebration === "max"
                ? MAX_EXPANSION_MS
                : REBIRTH_EXPLOSION_MS;

            if (now - celebrationStarted >= duration) {
              finishCelebration();
            }

            return;
          }

          trailTick++;

          for (const p of particles) {
            if (p.cooldown > 0) p.cooldown--;

            clampInside(p.pos, VISUAL_RADIUS);

            applyPhaseForce(p, dt);
            applyGravity(p, dt);

            p.pos.addScaledVector(p.vel, dt);
            bounceInsideSphere(p);

            if ((trailTick & 1) === 0) {
              recordTrail(p);
            }
          }

          processCollisions();
        }

        function celebrationProgress(now) {
          if (!celebration) return 0;

          const duration =
            celebration === "max"
              ? MAX_EXPANSION_MS
              : REBIRTH_EXPLOSION_MS;

          return THREE.MathUtils.clamp((now - celebrationStarted) / duration, 0, 1);
        }

        function updateArenaRadius(now) {
          if (celebration === "max") {
            const t = celebrationProgress(now);
            const eased = THREE.MathUtils.smoothstep(t, 0, 1);
            currentArenaRadius = THREE.MathUtils.lerp(ARENA_RADIUS, MAX_ARENA_RADIUS, eased);
            return;
          }

          if (celebration === "rebirth") {
            const t = celebrationProgress(now);
            const explosive = 1 - Math.pow(1 - t, 4.2);
            currentArenaRadius = THREE.MathUtils.lerp(rebirthStartRadius, MAX_ARENA_RADIUS, explosive);
            return;
          }

          if (mode === "merge") {
            if (!mergeShrinkStarted) {
              mergeShrinkStarted = now;
              mergeShrinkStartRadius = currentArenaRadius || MAX_ARENA_RADIUS;
            }

            const elapsed = Math.max(0, (now - mergeShrinkStarted) / 1000);
            currentArenaRadius = Math.max(
              MIN_ARENA_RADIUS,
              mergeShrinkStartRadius - MERGE_SHRINK_RATE * elapsed
            );
            return;
          }

          if (mode === "final") {
            if (!finalShrinkStarted) {
              mergeShrinkStartRadius = currentArenaRadius;
              finalShrinkStarted = now;
            }

            const elapsed = Math.max(0, (now - finalShrinkStarted) / 1000);
            currentArenaRadius = Math.max(
              FINAL_MIN_RADIUS,
              mergeShrinkStartRadius - FINAL_SHRINK_RATE * elapsed
            );
            return;
          }

          if (mode === "split" && postExplosionStarted > 0) {
            const t = THREE.MathUtils.clamp((now - postExplosionStarted) / POST_EXPLOSION_SETTLE_MS, 0, 1);
            const eased = THREE.MathUtils.smoothstep(t, 0, 1);
            currentArenaRadius = THREE.MathUtils.lerp(MAX_ARENA_RADIUS, ARENA_RADIUS, eased);

            if (t >= 1) {
              postExplosionStarted = 0;
              currentArenaRadius = ARENA_RADIUS;
            }

            return;
          }

          currentArenaRadius = ARENA_RADIUS;
        }

        function impactEnvelope(t) {
          const attack = THREE.MathUtils.smoothstep(t, 0.0, 0.16);
          const decay = 1.0 - THREE.MathUtils.smoothstep(t, 0.20, 1.0);
          return THREE.MathUtils.clamp(attack * decay, 0, 1);
        }

        function updateInstances(now) {
          const color = populationColor(tempColor);
          const t = celebrationProgress(now);
          const impact = impactEnvelope(t);
          const arenaScale = currentArenaRadius / ARENA_RADIUS;

          const pulse = celebration ? 1 + 0.10 * impact : 1;

          boundary.scale.setScalar(arenaScale);
          shell.scale.setScalar(arenaScale);
          ring.scale.setScalar(arenaScale);

          particleMesh.count = particles.length;
          glowMesh.count = particles.length;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            dummy.position.copy(p.pos);
            dummy.rotation.set(0, 0, 0);

            tempV3.copy(camera.position).sub(p.pos);
            const cameraDistance = tempV3.length();
            const depthScale = THREE.MathUtils.clamp(10.0 / cameraDistance, 0.82, 1.22);

            dummy.scale.setScalar(pulse * depthScale);
            dummy.updateMatrix();

            particleMesh.setMatrixAt(i, dummy.matrix);
            particleMesh.setColorAt(i, color);

            dummy.scale.setScalar(
              depthScale * (
                celebration === "max"
                  ? 1.25 + 0.35 * Math.sin(now * 0.018 + i)
                  : celebration === "rebirth"
                    ? 1.55 + 0.52 * Math.sin(now * 0.020 + i)
                    : 1
              )
            );
            dummy.updateMatrix();

            glowMesh.setMatrixAt(i, dummy.matrix);

            if (celebration === "max") {
              tempColor2.set(0xffd27a);
            } else if (celebration === "rebirth") {
              tempColor2.set(0xb9f6ff);
            } else {
              tempColor2.copy(color);
            }

            glowMesh.setColorAt(i, tempColor2);
          }

          particleMesh.instanceMatrix.needsUpdate = true;
          glowMesh.instanceMatrix.needsUpdate = true;

          if (particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate = true;
          if (glowMesh.instanceColor) glowMesh.instanceColor.needsUpdate = true;

          updateTrails();

          boundary.material.opacity = celebration ? 0.075 + 0.08 * impact : 0.075;
          shell.material.opacity = celebration ? 0.022 + 0.065 * impact : 0.022;

          if (celebration) {
            const waveScale = arenaScale * (celebration === "rebirth" ? 0.90 + t * 0.42 : 0.985 + t * 0.17);
            shockwaveSphere.visible = true;
            shockwaveSphere.scale.setScalar(waveScale);
            shockwaveSphere.material.opacity = Math.max(0, (1 - t) * 0.24);
            shockwaveSphere.material.color.set(celebration === "max" ? 0xffbc72 : 0xb6f7ff);
          } else {
            shockwaveSphere.visible = false;
            shockwaveSphere.material.opacity = 0;
            shockwaveSphere.scale.setScalar(1);
          }

          trailLines.visible = celebration !== "rebirth";
        }

        function updateCinematicEffects(now) {
          const p = populationProgress();
          const t = celebrationProgress(now);
          const impact = impactEnvelope(t);

          bokehPass.uniforms.focus.value = 8.55 + 0.12 * Math.sin(now * 0.00035);

          if (celebration) {
            const baseBloom = window.innerWidth < 900 ? 0.70 : 0.88;
            bloomPass.strength = baseBloom + (celebration === "max" ? 0.72 : 1.05) * impact;
            cinematicPass.uniforms.vignetteAmount.value = 0.30 - 0.10 * impact;
            camera.fov = celebration === "max" ? 48 + 1.15 * impact : 48 + 2.45 * impact;
          } else {
            bloomPass.strength = (window.innerWidth < 900 ? 0.52 : 0.70) + p * 0.10;
            cinematicPass.uniforms.vignetteAmount.value = 0.34;
            camera.fov = 48;
          }

          camera.updateProjectionMatrix();
          cinematicPass.uniforms.time.value = now;
        }

        function updateDynamicLighting() {
          const p = populationProgress();

          const cold = new THREE.Color(0x78dfff);
          const warm = new THREE.Color(0xff7040);

          keyLight.color.copy(cold).lerp(new THREE.Color(0xffffff), 0.65);
          rimLight.color.copy(cold).lerp(warm, p * 0.45);
          warmLight.color.copy(new THREE.Color(0xff7a3d));
          warmLight.intensity = 14 + p * 30;

          coreMaterial.emissive.copy(populationColor(tempColor2)).multiplyScalar(0.18 + p * 0.18);
          coreMaterial.emissiveIntensity = 0.55;

          boundary.material.color.copy(cold).lerp(warm, p * 0.35);
          shell.material.color.copy(cold).lerp(warm, p * 0.55);
        }

        function updateCamera(now) {
          controls.autoRotate = !orbiting && !pointer.pressed;
          controls.autoRotateSpeed =
            celebration === "rebirth"
              ? 0.14
              : celebration === "max"
                ? 0.22
                : 0.38;

          controls.target.set(
            0.05 * Math.sin(now * 0.00017),
            0.04 * Math.cos(now * 0.00013),
            0
          );

          controls.update();

          // Camera shake decay and offset calculation
          if (cameraShake > 0.001) {
            camera.position.x += (Math.random() - 0.5) * cameraShake;
            camera.position.y += (Math.random() - 0.5) * cameraShake;
            camera.position.z += (Math.random() - 0.5) * cameraShake;
            cameraShake *= 0.88;
          }
        }

        function animate(now) {
          const rawDt = (now - lastFrame) / 1000;
          lastFrame = now;
          const dt = Math.min(rawDt, 0.035);

          updateCamera(now);
          updateArenaRadius(now);
          updateDynamicLighting();
          updateCinematicEffects(now);
          updatePhysics(dt, now);
          updateInstances(now);

          composer.render(dt);
          requestAnimationFrame(animate);
        }

        function setPointerFromEvent(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.ndc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.ndc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          pointer.pointerType = event.pointerType || "mouse";
          pointer.active = true;
        }

        async function startExperience() {
          if (started) return;

          const audioReady = await unlockAudio();

          if (audioReady) {
            playIgnitionSound();
            await new Promise((resolve) => window.setTimeout(resolve, 110));
          }

          currentArenaRadius = ARENA_RADIUS;
          postExplosionStarted = 0;
          mergeShrinkStarted = 0;
          mergeShrinkStartRadius = MAX_ARENA_RADIUS;
          finalShrinkStarted = 0;
          rebirthStartRadius = MIN_ARENA_RADIUS;

          resetAt(new THREE.Vector3());

          controls.enabled = true;
          controls.autoRotate = true;

          requestAnimationFrame(() => {
            renderer.domElement.style.opacity = "1";
            if (hudEl) hudEl.classList.add("visible");
          });

          if (!animationLoopStarted) {
            animationLoopStarted = true;
            lastFrame = performance.now();
            requestAnimationFrame(animate);
          }
        }

        renderer.domElement.addEventListener("pointerdown", (event) => {
          event.preventDefault();

          if (!started) {
            void startExperience();
            return;
          }

          setPointerFromEvent(event);

          pointer.pressed = true;
          orbiting = false;

          gesture.down = true;
          gesture.startedAt = performance.now();
          gesture.startX = event.clientX;
          gesture.startY = event.clientY;
          gesture.moved = false;

          try {
            renderer.domElement.setPointerCapture(event.pointerId);
          } catch (_) {}
        });

        renderer.domElement.addEventListener("pointermove", (event) => {
          if (!started || !gesture.down) return;

          setPointerFromEvent(event);

          if (gesture.down) {
            const moved = Math.hypot(
              event.clientX - gesture.startX,
              event.clientY - gesture.startY
            );

            if (moved >= MOVE_THRESHOLD_PX) {
              gesture.moved = true;
              orbiting = true;
              pointer.pressed = false;
            }
          }
        });

        renderer.domElement.addEventListener("pointerup", (event) => {
          event.preventDefault();

          if (!gesture.down) return;

          gesture.down = false;
          pointer.pressed = false;
          orbiting = false;

          if (pointer.pointerType !== "mouse") {
            pointer.active = false;
          }

          try {
            renderer.domElement.releasePointerCapture(event.pointerId);
          } catch (_) {}

          gesture.moved = false;
        });

        renderer.domElement.addEventListener("pointercancel", () => {
          gesture.down = false;
          gesture.moved = false;
          pointer.pressed = false;
          orbiting = false;

          if (pointer.pointerType !== "mouse") {
            pointer.active = false;
          }
        });

        renderer.domElement.addEventListener("pointerleave", () => {
          if (!gesture.down) {
            pointer.active = false;
            pointer.pressed = false;
            orbiting = false;
          }
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();

          const pr = renderPixelRatio();

          renderer.setPixelRatio(pr);
          renderer.setSize(window.innerWidth, window.innerHeight);

          composer.setPixelRatio(pr);
          composer.setSize(window.innerWidth, window.innerHeight);

          bloomPass.setSize(window.innerWidth, window.innerHeight);
          bloomPass.strength = window.innerWidth < 900 ? 0.58 : 0.78;

          bokehPass.uniforms.aperture.value = window.innerWidth < 900 ? 0.00028 : 0.00042;
          bokehPass.uniforms.maxblur.value = window.innerWidth < 900 ? 0.0038 : 0.0058;
          cinematicPass.uniforms.grainAmount.value = window.innerWidth < 900 ? 0.016 : 0.012;

          controls.update();
        });

        started = false;
        paused = false;
        particles = [];
        particleMesh.count = 0;
        glowMesh.count = 0;
        trailGeometry.setDrawRange(0, 0);
        sparkGeometry.setDrawRange(0, 0);

        renderer.setClearColor(0x000000, 1);
        renderer.clear();
      } catch (error) {
        console.error(error);
        errorText.textContent =
          "The 3D engine could not load or WebGL initialization failed. " +
          (error && error.message ? error.message : "");
        errorBox.classList.add("show");
      }
    })();
  </script>
</body>
</html>
